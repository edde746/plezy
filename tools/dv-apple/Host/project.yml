# Optional iOS/tvOS host. Generate inside the prepared work/host directory with
# XcodeGen, then build/sign with the tester's own development team.
name: PlezyNGDVExperiment
options:
  bundleIdPrefix: com.plezyng.dvexperiment
  deploymentTarget:
    iOS: "18.0"
    tvOS: "18.0"
packages:
  DVExperiment:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  PlezyNGDVExperimentIOS:
    type: application
    platform: iOS
    sources: [Sources/PlezyNGDVExperiment]
    dependencies:
      - package: DVExperiment
        product: DVExperimentCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.plezyng.dvexperiment.ios
  PlezyNGDVExperimentTV:
    type: application
    platform: tvOS
    sources: [Sources/PlezyNGDVExperiment]
    dependencies:
      - package: DVExperiment
        product: DVExperimentCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.plezyng.dvexperiment.tv
