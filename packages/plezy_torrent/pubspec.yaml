name: plezy_torrent
description: Private native torrent streaming backend for PlezyNG.
version: 1.0.0
publish_to: none
environment:
  sdk: '>=3.12.0 <4.0.0'
dependencies:
  ffi: ^2.1.4
  path: ^1.9.0
flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      windows:
        ffiPlugin: true
