name: package_info_plus_webos
description: webOS implementation of the package_info_plus plugin.
version: 1.0.0

environment:
  sdk: '>=3.1.0 <4.0.0'
  flutter: '>=3.13.0'

dependencies:
  flutter:
    sdk: flutter
  package_info_plus_platform_interface: ^3.2.1

flutter:
  plugin:
    platforms:
      webos:
        dartPluginClass: PackageInfoPlusWebOSPlugin

dev_dependencies:
  flutter_lints: ^5.0.0
