name: flutter_secure_storage_webos
description: webOS implementation of flutter_secure_storage. Please use flutter_secure_storage instead of this package.
version: 1.0.0

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage_platform_interface: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      webos:
        dartPluginClass: FlutterSecureStorageWebos
        pluginClass: FlutterSecureStorageWebosPlugin
