apply plugin: 'com.android.library'

// The same source is compiled into Plezy's application ID. Never install or
// launch an upstream APK. Pin changes and adapter patches live in the repository.
def sourceRoot = rootProject.file('../.dart_tool/games/moonlight-android')
def recipe = rootProject.file('../scripts/games/prepare_moonlight.py')
providers.exec {
    commandLine System.getProperty('os.name').toLowerCase().contains('windows') ? 'python' : 'python3', recipe.absolutePath
}.result.get().assertNormalExitValue()

repositories {
    exclusiveContent {
        forRepository { maven { url 'https://jitpack.io' } }
        filter { includeGroup 'com.github.cgutman' }
    }
}
android {
    namespace 'com.limelight'
    compileSdk 37
    ndkVersion '29.0.14206865'
    defaultConfig {
        minSdk 21
        buildConfigField 'boolean', 'ROOT_BUILD', 'false'
        buildConfigField 'String', 'VERSION_NAME', '"12.2-plezy"'
        buildConfigField 'int', 'VERSION_CODE', '315'
        buildConfigField 'String', 'APPLICATION_ID', '"org.snapetech.plezyng"'
        resValue 'string', 'app_label', 'Games'
        resValue 'string', 'app_label_root', 'Games'
        consumerProguardFiles 'consumer-rules.pro'
        externalNativeBuild { ndkBuild { arguments 'PRODUCT_FLAVOR=nonRoot' } }
    }
    buildFeatures { buildConfig = true; resValues = true }
    sourceSets {
        main {
            manifest.srcFile new File(sourceRoot, 'EmbeddedManifest.xml')
            java.srcDirs += new File(sourceRoot, 'app/src/main/java')
            res.srcDirs += new File(sourceRoot, 'app/src/main/res')
            assets.srcDirs += new File(sourceRoot, 'app/src/main/assets')
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    externalNativeBuild { ndkBuild { path new File(sourceRoot, 'app/src/main/jni/Android.mk') } }
    packaging { resources { excludes += '/META-INF/*.md' } }
}
dependencies {
    implementation 'org.bouncycastle:bcprov-jdk18on:1.85.2'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.85'
    implementation 'org.jcodec:jcodec:0.2.5'
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'
    implementation 'org.jmdns:jmdns:3.6.3'
    implementation 'com.github.cgutman:ShieldControllerExtensions:1.0.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
