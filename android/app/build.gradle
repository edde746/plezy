plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'dev.flutter.flutter-gradle-plugin'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}
def flutterVersionCode = localProperties.getProperty('flutter.versionCode', '1')
def flutterVersionName = localProperties.getProperty('flutter.versionName', '0.1.0')

def gkuiKeystorePath = System.getenv('GKUI_KEYSTORE_PATH')
def hasGkuiKeystore = gkuiKeystorePath != null && !gkuiKeystorePath.isBlank()

android {
    namespace 'com.edde746.plezy'
    compileSdk 34
    buildToolsVersion '34.0.0'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.resources.srcDirs += '../../assets'
    }

    defaultConfig {
        applicationId 'com.jialim.plezygkui'
        minSdk 19
        targetSdk 34
        multiDexEnabled true
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        ndk {
            abiFilters 'armeabi-v7a'
        }
    }

    signingConfigs {
        if (hasGkuiKeystore) {
            gkuiTest {
                storeFile file(gkuiKeystorePath)
                storePassword System.getenv('GKUI_KEYSTORE_PASSWORD')
                keyAlias System.getenv('GKUI_KEY_ALIAS')
                keyPassword System.getenv('GKUI_KEY_PASSWORD')
                enableV1Signing true
            }
        }
    }

    buildTypes {
        release {
            if (hasGkuiKeystore) {
                signingConfig signingConfigs.gkuiTest
            }
            minifyEnabled false
            shrinkResources false
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    lint {
        // Plezy never instantiates ExoPlayer's offline DownloadService.
        // Do not request Android 13 notification access for unreachable library code.
        disable 'NotificationPermission'
    }
}

flutter {
    source '../..'
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.google.android.exoplayer:exoplayer-core:2.19.1'
    implementation 'com.google.android.exoplayer:exoplayer-hls:2.19.1'
    implementation 'com.google.android.exoplayer:exoplayer-ui:2.19.1'
    implementation('com.google.android.exoplayer:extension-okhttp:2.19.1') {
        exclude group: 'com.squareup.okhttp3', module: 'okhttp'
    }
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'
}
