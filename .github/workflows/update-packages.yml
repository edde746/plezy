# ng-runner-policy: private-jit-only-v1
name: Update Packages
run-name: ${{ format('action:{0}:pool:{1}:tag:{2}', inputs.action, inputs.runner_pool, inputs.release_tag) }}

on:
  workflow_dispatch:
    inputs:
      action:
        description: Package update action authorized by private JIT routing
        required: true
        type: choice
        options: [update-packages]
      runner_pool:
        description: Runner pool for this update
        required: true
        type: choice
        options: [private]
      release_tag:
        description: Published release tag to update packages for
        required: true
        type: string

# Publication gates also run before a repository has been checked out.
env:
  GH_REPO: ${{ github.repository }}

concurrency:
  group: update-release-packages
  cancel-in-progress: false

jobs:
  resolve-release:
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-plezyng","ng-main-run-{0}","gha-{0}-resolve-release"]}}', github.run_id)) }}
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      homebrew_enabled: ${{ steps.release.outputs.homebrew_enabled }}
    steps:
      - name: Require the default branch for manual runs
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/${{ github.event.repository.default_branch }}" ]]; then
            echo "Manual package updates may only run from the default branch." >&2
            exit 1
          fi

      - name: Resolve published release tag
        id: release
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            REQUESTED_TAG="$EVENT_TAG"
          else
            REQUESTED_TAG="$INPUT_TAG"
          fi

          if [ -z "$REQUESTED_TAG" ]; then
            echo "A release tag is required." >&2
            exit 1
          fi

          RELEASE=$(gh release view "$REQUESTED_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,publishedAt)
          RESOLVED_TAG=$(jq -r '.tagName' <<< "$RELEASE")
          IS_DRAFT=$(jq -r '.isDraft' <<< "$RELEASE")
          PUBLISHED_AT=$(jq -r '.publishedAt // empty' <<< "$RELEASE")

          if [ "$RESOLVED_TAG" != "$REQUESTED_TAG" ] || \
             [ "$IS_DRAFT" != "false" ] || [ -z "$PUBLISHED_AT" ]; then
            echo "Tag '$REQUESTED_TAG' is not an exact published release tag." >&2
            exit 1
          fi

          if [[ ! "$RESOLVED_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag '$RESOLVED_TAG' is not a stable semantic version." >&2
            exit 1
          fi
          VERSION="${RESOLVED_TAG#v}"
          TAG_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RESOLVED_TAG" --jq '.object.sha')
          TAG_TYPE=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RESOLVED_TAG" --jq '.object.type')
          if [ "$TAG_TYPE" = "tag" ]; then
            TAG_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$TAG_SHA" --jq '.object.sha')
          fi
          MAIN_SHA=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')
          COMPARE_STATUS=$(gh api "repos/$GITHUB_REPOSITORY/compare/$TAG_SHA...$MAIN_SHA" --jq '.status')
          if [[ "$COMPARE_STATUS" != "ahead" && "$COMPARE_STATUS" != "identical" ]]; then
            echo "Release '$RESOLVED_TAG' is not on main or an ancestor of main." >&2
            exit 1
          fi

          echo "tag=$RESOLVED_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ -n "$MACOS_CERTIFICATE_BASE64" && -n "$MACOS_CERTIFICATE_PASSWORD" && \
                -n "$KEYCHAIN_PASSWORD" && -n "$APPLE_ID" && \
                -n "$APPLE_APP_SPECIFIC_PASSWORD" && -n "$APPLE_TEAM_ID" ]]; then
            echo "homebrew_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "homebrew_enabled=false" >> "$GITHUB_OUTPUT"
            echo "Developer ID signing and notarization are not configured; skipping the Homebrew Cask update."
          fi

  update-homebrew:
    needs: resolve-release
    if: needs.resolve-release.outputs.homebrew_enabled == 'true'
    runs-on: ${{ fromJSON(format('{{"group":"private-apple-builds","labels":["self-hosted","macOS","ARM64","private-apple","ng-shared-main-plezyng","ng-main-run-{0}","gha-{0}-update-homebrew"]}}', github.run_id)) }}
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
      RELEASE_VERSION: ${{ needs.resolve-release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Download and hash release
        id: release
        run: |
          curl --fail-with-body -L -o plezyng-macos.dmg \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/plezyng-macos.dmg"
          SHA256=$(shasum -a 256 plezyng-macos.dmg | cut -d' ' -f1)
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Update cask
        run: |
          sed -i '' "s/version \".*\"/version \"$RELEASE_VERSION\"/" Casks/plezy.rb
          sed -i '' "s/sha256 \".*\"/sha256 \"${{ steps.release.outputs.sha256 }}\"/" Casks/plezy.rb

      - name: Commit
        run: |
          BRANCH="${{ github.event.repository.default_branch }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/plezy.rb
          if ! git diff --staged --quiet; then
            git commit -m "chore: update cask to $RELEASE_TAG"
            git push origin "HEAD:$BRANCH"
          else
            echo "No cask changes to commit."
          fi

  update-appcast-branch:
    needs: resolve-release
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-plezyng","ng-main-run-{0}","gha-{0}-update-appcast-branch"]}}', github.run_id)) }}
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download appcast.xml from release
        run: |
          gh release download "$RELEASE_TAG" \
            --pattern "appcast.xml"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to appcast branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp appcast.xml "$RUNNER_TEMP/plezy-appcast.xml"
          git restore -- appcast.xml 2>/dev/null || rm -f appcast.xml

          if git ls-remote --exit-code --heads origin appcast >/dev/null 2>&1; then
            git fetch origin appcast
            git checkout -B appcast FETCH_HEAD
          else
            git switch --orphan appcast
            git rm -rf --ignore-unmatch .
          fi

          cp "$RUNNER_TEMP/plezy-appcast.xml" appcast.xml
          git add appcast.xml
          if ! git diff --cached --quiet; then
            git commit -m "Update appcast for $RELEASE_TAG"
            git push origin HEAD:refs/heads/appcast
          else
            echo "The appcast branch already has this release."
          fi
