name: Build
run-name: ${{ inputs.release_tag != '' && format('Release {0}', inputs.release_tag) || format('Build {0}', github.sha) }}

# The release build: run by hand from main, it builds every platform into Actions artifacts and, given a release tag
# equal to version.xcconfig's MARKETING_VERSION, drafts a GitHub release with them. A draft needs all five platforms.
#
#   Android    APKs per ABI (arm64-v8a, armeabi-v7a, x86_64) for the release, each plezy-android-<abi>.tar.gz holding
#              plezy.apk; as artifacts only the AAB for Google Play and the Amazon Appstore's APK (the ARM ABIs in one
#              APK). All signed with the upload keystore. The AAB is the store build, the Amazon APK the amazon one,
#              the release's APKs sideloaded ones (-Pplezy.flavor, settings.gradle.kts; versionCodes per channel in
#              android/app/build.gradle.kts).
#   iOS        the unsigned IPA (sideloaded build), for the release; tvOS's unsigned IPA as an artifact only.
#   macOS      the Developer ID-signed, notarized DMG and its Sparkle signature, for the release.
#   Windows    each architecture's app image built on its own runner (x64, arm64), then one job packs both into the
#              installer (plezy-windows-installer.exe, both architectures) and the portable archives, for the release
#              (sideloaded builds), and the MSIX bundle for Partner Center as an artifact only, unsigned because the
#              Store signs it (store builds).
#   Linux      deb, rpm, pacman, tarball, AppImage (+ zsync) and Flatpak per architecture (x64, arm64), with
#              JetBrains Runtime, for the release. Sideloaded builds.
# The release also carries appcast.xml, the Sparkle feed of the macOS and Windows apps (an enclosure for each signed
# installer; update-packages.yml copies it to the appcast branch the apps read once the release is published), and
# SHA256SUMS, every attached file's sha256, for people who download them by hand.
#
# Two runs of one commit build from the same inputs: the JDKs are exact builds (Temurin and Zulu by version, JetBrains
# Runtime by sha512), XcodeGen is the release tools/install_xcodegen.sh checks, and the Linux job's Ubuntu libraries
# and Flatpak runtime are pinned by sha256 and commit (their steps below). Moving one is a change here.
#
# Secrets:
#   ANDROID_KEYSTORE_BASE64, ANDROID_STORE_PASSWORD, ANDROID_KEY_PASSWORD, ANDROID_KEY_ALIAS (the upload keystore)
#   MACOS_CERTIFICATE_BASE64 (Developer ID Application .p12), MACOS_CERTIFICATE_PASSWORD, KEYCHAIN_PASSWORD,
#   MACOS_PROVISIONING_PROFILE_BASE64 (Developer ID profile for com.edde746.plezy that grants the keychain access
#     group of apple/Plezy/AppKit/Plezy-macOS.entitlements),
#   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID (the Apple ID, an app-specific password of it and its team:
#     notarytool notarizes with them)
#   SPARKLE_PRIVATE_KEY (base64 EdDSA seed of Plezy's update key, whose public key is SPARKLE_PUBLIC_KEY below; signs
#     the DMG and the Windows installer, tools/sparkle_sign.py)
#   PLEZY_SENTRY_DSN (the DSN of the Plezy project on bugs.plezy.app, where crash reports go)
#   BUGS_ADMIN_TOKEN (bugs.plezy.app's admin token: the Android, Windows and Linux jobs upload their native libraries'
#     symbols with it, the Apple jobs their dSYMs; the server takes no R8 mapping, so the Android job keeps those as an
#     artifact)
# Without them a build still runs: the APKs and the AAB are debug-signed, the macOS app keeps Xcode's ad-hoc signature
# and is not notarized, the DMG and the installer have no Sparkle signature (and no appcast enclosure), no build sends
# crash reports and no symbols are uploaded. A release tag requires the signing ones.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag for a draft release (MARKETING_VERSION); omit to build Actions artifacts only
        default: ''
        type: string
      build_android:
        description: Build Android
        default: true
        type: boolean
      build_ios:
        description: Build iOS (and tvOS)
        default: true
        type: boolean
      build_macos:
        description: Build macOS
        default: true
        type: boolean
      build_windows:
        description: Build Windows
        default: true
        type: boolean
      build_linux:
        description: Build Linux
        default: true
        type: boolean

permissions: {}

# The crash reports' DSN, read by shared/build.gradle.kts's generateCrashReportConfig: only these builds send crash
# reports, so development, CI and harness builds, which never have it, send none. The symbol uploads
# (tools/upload_symbols.sh) go to the Plezy project on bugs.plezy.app, which runs edde746/bugs. SPARKLE_PUBLIC_KEY is
# the update key the apps check signatures with (the macOS app's SUPublicEDKey); the signing steps refuse a
# SPARKLE_PRIVATE_KEY of another key.
env:
  PLEZY_SENTRY_DSN: ${{ secrets.PLEZY_SENTRY_DSN }}
  SENTRY_URL: https://bugs.plezy.app
  SENTRY_ORG: plezy
  SENTRY_PROJECT: plezy
  SPARKLE_PUBLIC_KEY: q7t6eu1txRrqv1PeWDCRV95rFxnmD/D3GZWbUPMwUyU=

jobs:
  validate-trusted-ref:
    name: Validate trusted build ref
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      # The public beta builds from kmp-beta, as Actions artifacts only: a release tag still requires main.
      - name: Require the protected main branch
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "$GITHUB_REF" == "refs/heads/kmp-beta" && -z "$RELEASE_TAG" ]]; then
            echo "Beta build from kmp-beta: artifacts only."
          elif [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Release builds may only run from refs/heads/main." >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            version.xcconfig
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Read version from version.xcconfig
        id: version
        run: |
          version=$(sed -n 's/^MARKETING_VERSION *= *\([^ ]*\) *$/\1/p' version.xcconfig)
          build_number=$(sed -n 's/^CURRENT_PROJECT_VERSION *= *\([^ ]*\) *$/\1/p' version.xcconfig)
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "MARKETING_VERSION is not major.minor.patch: $version" >&2; exit 1; }
          [[ $build_number =~ ^[1-9][0-9]*$ ]] || { echo "CURRENT_PROJECT_VERSION is not a positive integer: $build_number" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"

      # Before any build, so a wrong tag doesn't cost a full run.
      - name: Validate release tag
        if: ${{ inputs.release_tag != '' }}
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use semantic versioning: $RELEASE_TAG" >&2
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "$VERSION" ]]; then
            echo "Release tag $RELEASE_TAG does not match MARKETING_VERSION $VERSION in version.xcconfig." >&2
            exit 1
          fi

  build-android:
    name: Build Android
    needs: validate-trusted-ref
    if: ${{ inputs.build_android }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    env:
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      HAS_SYMBOL_UPLOAD: ${{ secrets.BUGS_ADMIN_TOKEN != '' && github.repository == 'edde746/plezy' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 27 runs Gradle and builds Android; the desktop modules' 25 is configured too (settings include them).
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            25.0.4+101.0.LTS
            27.0.0+35
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Require signing for a release
        if: ${{ inputs.release_tag != '' && env.HAS_SIGNING != 'true' }}
        run: |
          echo "Release $RELEASE_TAG needs the ANDROID_* signing secrets." >&2
          exit 1

      # android/app/build.gradle.kts signs release builds with the keystore key.properties names.
      - name: Configure Android signing
        if: ${{ env.HAS_SIGNING == 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/app/key.properties << EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      # Three builds: AGP refuses to build the bundle while the per-ABI APK splits are on, and Amazon's APK is one APK
      # of its own flavor. Each runs R8 once; bugs.plezy.app takes no mapping, so each mapping file is kept as
      # r8-mappings/<uuid>.txt, by the UUID its app carries and its reports name (assets/sentry-debug-meta.properties,
      # android/app/build.gradle.kts). Each build's outputs are copied out before the next writes the same paths.
      - name: Build the Play bundle
        run: |
          ./gradlew --console=plain -Pplezy.flavor=store :app-android:bundleRelease
          uuid=$(unzip -p android/app/build/outputs/bundle/release/app-android-release.aab \
            base/assets/sentry-debug-meta.properties | sed -n 's/^io\.sentry\.ProguardUuids=//p')
          [[ -n $uuid ]] || { echo "The bundle names no R8 mapping UUID." >&2; exit 1; }
          mkdir -p r8-mappings
          cp android/app/build/outputs/mapping/release/mapping.txt "r8-mappings/$uuid.txt"
          cp android/app/build/outputs/bundle/release/app-android-release.aab plezy-android.aab

      # Amazon's: one APK with the ARM ABIs (Fire devices are ARM), versionCode N + 3000.
      - name: Build the Amazon APK
        run: |
          ./gradlew --console=plain -Pplezy.flavor=amazon :app-android:assembleRelease
          uuid=$(unzip -p android/app/build/outputs/apk/release/app-android-release.apk \
            assets/sentry-debug-meta.properties | sed -n 's/^io\.sentry\.ProguardUuids=//p')
          [[ -n $uuid ]] || { echo "The Amazon APK names no R8 mapping UUID." >&2; exit 1; }
          cp android/app/build/outputs/mapping/release/mapping.txt "r8-mappings/$uuid.txt"
          cp android/app/build/outputs/apk/release/app-android-release.apk plezy-amazon.apk

      - name: Build APKs
        run: |
          ./gradlew --console=plain -Pplezy.flavor=sideloaded -Pplezy.abiSplits=true :app-android:assembleRelease
          uuid=$(unzip -p android/app/build/outputs/apk/release/app-android-arm64-v8a-release.apk \
            assets/sentry-debug-meta.properties | sed -n 's/^io\.sentry\.ProguardUuids=//p')
          [[ -n $uuid ]] || { echo "The APKs name no R8 mapping UUID." >&2; exit 1; }
          cp android/app/build/outputs/mapping/release/mapping.txt "r8-mappings/$uuid.txt"

      # The debug files of the native libraries the bundle and the APKs ship (every ABI; mpv-build's unstripped copies
      # of libmpv, FFmpeg and the JNI glue, pinned in mpv-build.lock.json, matched by build ID), so the reports' native
      # frames, libmpv's among them, symbolicate.
      - name: Upload native symbols
        if: ${{ env.HAS_SYMBOL_UPLOAD == 'true' }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.BUGS_ADMIN_TOKEN }}
        run: >
          tools/upload_symbols.sh android plezy-android.aab plezy-amazon.apk
          android/app/build/outputs/apk/release/app-android-*-release.apk

      - name: Clean up keystore
        if: always()
        run: rm -f android/app/upload-keystore.jks android/app/key.properties

      - name: Package APKs
        run: |
          for abi in arm64-v8a armeabi-v7a x86_64; do
            tar -czf "plezy-android-$abi.tar.gz" -C android/app/build/outputs/apk/release \
              "app-android-$abi-release.apk" --transform "s/app-android-$abi-release.apk/plezy.apk/"
          done

      - name: Attest Android artifacts
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            plezy-android-arm64-v8a.tar.gz
            plezy-android-armeabi-v7a.tar.gz
            plezy-android-x86_64.tar.gz
            plezy-android.aab
            plezy-amazon.apk

      - name: Upload APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-apk
          path: |
            plezy-android-arm64-v8a.tar.gz
            plezy-android-armeabi-v7a.tar.gz
            plezy-android-x86_64.tar.gz

      # For the Play Console only; not attached to the release.
      - name: Upload Play bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-aab
          path: plezy-android.aab

      # For the Amazon Appstore only; not attached to the release.
      - name: Upload Amazon APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-amazon
          path: plezy-amazon.apk

      # Not attached to the release: a report's debug_meta names the UUID of the mapping that retraces it.
      - name: Upload R8 mappings
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-r8-mappings
          path: r8-mappings/

  build-ios:
    name: Build ${{ matrix.name }}
    needs: validate-trusted-ref
    if: ${{ inputs.build_ios }}
    # The apps build against the iOS, tvOS and macOS 27 SDKs: Xcode 27.2, which macos-26 doesn't have.
    runs-on: xcode-27
    permissions:
      id-token: write
      attestations: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS
            scheme: Plezy-iOS
            platform: iOS
            products: Release-iphoneos
            ipa: plezy-ios.ipa
            artifact: ios-ipa
          # An artifact only: the release carries no tvOS IPA.
          - name: tvOS
            scheme: Plezy-tvOS
            platform: tvOS
            products: Release-appletvos
            ipa: plezy-tvos.ipa
            artifact: tvos-ipa
    env:
      # No Android SDK here; settings.gradle.kts then leaves the Android modules and targets out.
      PLEZY_ANDROID: "false"
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      SCHEME: ${{ matrix.scheme }}
      PLATFORM: ${{ matrix.platform }}
      PRODUCTS: ${{ matrix.products }}
      IPA: ${{ matrix.ipa }}
      HAS_SYMBOL_UPLOAD: ${{ secrets.BUGS_ADMIN_TOKEN != '' && github.repository == 'edde746/plezy' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 27.0.0+35
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # The runner has 7 GB of memory, less than the heaps gradle.properties gives Gradle (6 GB) and the Kotlin daemon
      # (4 GB) for local builds; the user home's gradle.properties overrides the project's, for Xcode's Gradle phase too.
      - name: Fit the Gradle heaps to the runner
        run: |
          mkdir -p ~/.gradle
          printf '%s\n' 'org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8' 'kotlin.daemon.jvmargs=-Xmx2g' >> ~/.gradle/gradle.properties

      - name: Generate the Xcode project
        run: |
          xcodegen=$(tools/install_xcodegen.sh "$RUNNER_TEMP")
          cd apple && "$xcodegen" generate

      # The Kotlin script phase builds PlezyKit's release framework for the device. The GitHub release's builds are
      # sideloaded ones (Info.plist's PlezyFlavor; the project's default is the App Store's).
      - name: Build ${{ matrix.name }} (no codesign)
        run: |
          xcodebuild -project apple/Plezy.xcodeproj -scheme "$SCHEME" -configuration Release \
            -destination "generic/platform=$PLATFORM" -derivedDataPath apple/build/dd \
            -clonedSourcePackagesDirPath apple/build/spm CODE_SIGNING_ALLOWED=NO PLEZY_APPLE_FLAVOR=SIDELOADED build

      # The app's dSYMs (PlezyKit is static, so Kotlin's code is in the app's) and its frameworks'.
      - name: Upload dSYMs
        if: ${{ env.HAS_SYMBOL_UPLOAD == 'true' }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.BUGS_ADMIN_TOKEN }}
        run: tools/upload_symbols.sh dsym "apple/build/dd/Build/Products/$PRODUCTS"

      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -R "apple/build/dd/Build/Products/$PRODUCTS/Plezy.app" Payload/
          zip -qry "$IPA" Payload

      - name: Attest IPA
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ matrix.ipa }}

      - name: Upload IPA
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.ipa }}

  build-macos:
    name: Build macOS
    needs: validate-trusted-ref
    if: ${{ inputs.build_macos }}
    runs-on: xcode-27
    permissions:
      id-token: write
      attestations: write
      contents: read
    env:
      PLEZY_ANDROID: "false"
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      APP_PATH: apple/build/dd/Build/Products/Release/Plezy.app
      HAS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_BASE64 != '' }}
      HAS_NOTARIZATION: ${{ secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
      HAS_SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY != '' }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      HAS_SYMBOL_UPLOAD: ${{ secrets.BUGS_ADMIN_TOKEN != '' && github.repository == 'edde746/plezy' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 27.0.0+35
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # The runner has 7 GB of memory, less than the project's local heaps: as in build-ios.
      - name: Fit the Gradle heaps to the runner
        run: |
          mkdir -p ~/.gradle
          printf '%s\n' 'org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8' 'kotlin.daemon.jvmargs=-Xmx2g' >> ~/.gradle/gradle.properties

      - name: Require signing, notarization and Sparkle for a release
        if: ${{ inputs.release_tag != '' && (env.HAS_SIGNING != 'true' || env.HAS_NOTARIZATION != 'true' || env.HAS_SPARKLE_KEY != 'true') }}
        run: |
          echo "Release $RELEASE_TAG needs the MACOS_*, APPLE_* and SPARKLE_PRIVATE_KEY secrets." >&2
          exit 1

      - name: Generate the Xcode project
        run: |
          xcodegen=$(tools/install_xcodegen.sh "$RUNNER_TEMP")
          cd apple && "$xcodegen" generate

      # Universal (arm64 and x86_64, the project's macOS ARCHS), for Apple silicon and Intel Macs. Signed ad hoc by the
      # project; the steps below re-sign. The Mac app is always a sideloaded build (apple/project.yml).
      - name: Build macOS
        run: |
          xcodebuild -project apple/Plezy.xcodeproj -scheme Plezy-macOS -configuration Release \
            -destination "generic/platform=macOS" -derivedDataPath apple/build/dd \
            -clonedSourcePackagesDirPath apple/build/spm build

      # Sparkle refuses an update whose signature its SUPublicEDKey doesn't verify.
      - name: Check the app's Sparkle key
        run: |
          key=$(/usr/libexec/PlistBuddy -c "Print :SUPublicEDKey" "$APP_PATH/Contents/Info.plist")
          if [[ "$key" != "$SPARKLE_PUBLIC_KEY" ]]; then
            echo "The app's SUPublicEDKey is $key, not Plezy's update key $SPARKLE_PUBLIC_KEY." >&2
            exit 1
          fi

      # The app's dSYMs, as in build-ios; signing below doesn't change their UUIDs.
      - name: Upload dSYMs
        if: ${{ env.HAS_SYMBOL_UPLOAD == 'true' }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.BUGS_ADMIN_TOKEN }}
        run: tools/upload_symbols.sh dsym apple/build/dd/Build/Products/Release

      - name: Import Code Signing Certificate
        if: ${{ env.HAS_SIGNING == 'true' }}
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          echo "$MACOS_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm "$CERTIFICATE_PATH"

          # Add keychain to search list
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain

          # The Developer ID profile grants the keychain access group (apple/Plezy/AppKit/Plezy-macOS.entitlements).
          if [[ -z "$MACOS_PROVISIONING_PROFILE_BASE64" ]]; then
            echo "MACOS_PROVISIONING_PROFILE_BASE64 is required with the certificate." >&2
            exit 1
          fi
          echo "$MACOS_PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$RUNNER_TEMP/plezy.provisionprofile"

      - name: Sign Application
        if: ${{ env.HAS_SIGNING == 'true' }}
        run: |
          IDENTITY=$(security find-identity -v -p codesigning | grep "Developer ID Application" | head -1 | grep -o '".*"' | tr -d '"')
          echo "Signing with identity: $IDENTITY"

          cp "$RUNNER_TEMP/plezy.provisionprofile" "$APP_PATH/Contents/embedded.provisionprofile"

          # Inside out, since a bundle's signature seals what it holds: Sparkle's helpers as Sparkle's documentation
          # re-signs them (the Downloader keeps its own entitlements), then each framework and dylib the app embeds
          # (MPVKit's, Sentry, Sparkle), then the app. Every codesign failure fails the step.
          SPARKLE="$APP_PATH/Contents/Frameworks/Sparkle.framework/Versions/B"
          for item in "$SPARKLE/XPCServices/Installer.xpc" "$SPARKLE/Autoupdate" "$SPARKLE/Updater.app"; do
            echo "Signing: $item"
            codesign --force --sign "$IDENTITY" --timestamp --options runtime "$item"
          done
          echo "Signing: $SPARKLE/XPCServices/Downloader.xpc"
          codesign --force --sign "$IDENTITY" --timestamp --options runtime --preserve-metadata=entitlements \
            "$SPARKLE/XPCServices/Downloader.xpc"
          find "$APP_PATH/Contents/Frameworks" -mindepth 1 -maxdepth 1 \( -name "*.framework" -o -name "*.dylib" \) -print0 \
            | while IFS= read -r -d '' item; do
              echo "Signing: $item"
              codesign --force --sign "$IDENTITY" --timestamp --options runtime "$item"
            done

          # Sign the app bundle itself
          echo "Signing app bundle: $APP_PATH"
          codesign --force --sign "$IDENTITY" --timestamp --options runtime \
            --entitlements apple/Plezy/AppKit/Plezy-macOS.entitlements "$APP_PATH"

      - name: Verify Signature
        if: ${{ env.HAS_SIGNING == 'true' }}
        run: |
          echo "Verifying signature..."
          codesign -dvvv "$APP_PATH"
          echo "Verifying signed entitlements..."
          codesign -d --entitlements :- "$APP_PATH" > "$RUNNER_TEMP/macos-entitlements.plist"
          /usr/libexec/PlistBuddy -c "Print" "$RUNNER_TEMP/macos-entitlements.plist"
          /usr/libexec/PlistBuddy -c "Print :keychain-access-groups:0" "$RUNNER_TEMP/macos-entitlements.plist"
          # MPVKit's LuaJIT needs both exceptions under the hardened runtime.
          for key in com.apple.security.cs.allow-jit com.apple.security.cs.allow-unsigned-executable-memory; do
            [[ $(/usr/libexec/PlistBuddy -c "Print :$key" "$RUNNER_TEMP/macos-entitlements.plist") == true ]] \
              || { echo "The signed app lacks $key." >&2; exit 1; }
          done
          # macOS refuses to launch an app whose restricted entitlements its profile doesn't grant.
          security cms -D -i "$APP_PATH/Contents/embedded.provisionprofile" > "$RUNNER_TEMP/macos-profile.plist"
          /usr/libexec/PlistBuddy -c "Print :Entitlements:keychain-access-groups" "$RUNNER_TEMP/macos-profile.plist"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Notarize Application
        if: ${{ env.HAS_SIGNING == 'true' && env.HAS_NOTARIZATION == 'true' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Create a temporary ZIP for notarization submission
          echo "Creating ZIP for notarization..."
          ditto -c -k --keepParent "$APP_PATH" notarization.zip

          # Submit for notarization. notarytool exits 0 however the notary service decides, Invalid included, so the
          # submission's status decides the step, and anything but Accepted prints Apple's log of the submission.
          echo "Submitting to Apple's notary service..."
          AUTH=(--apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID")
          xcrun notarytool submit notarization.zip "${AUTH[@]}" --wait --output-format json \
            > "$RUNNER_TEMP/notarization.json"
          cat "$RUNNER_TEMP/notarization.json"
          SUBMISSION_ID=$(plutil -extract id raw "$RUNNER_TEMP/notarization.json")
          STATUS=$(plutil -extract status raw "$RUNNER_TEMP/notarization.json")
          if [[ "$STATUS" != "Accepted" ]]; then
            echo "Notarization of submission $SUBMISSION_ID ended $STATUS; the notary service's log:" >&2
            xcrun notarytool log "$SUBMISSION_ID" "${AUTH[@]}"
            exit 1
          fi

          # Staple the notarization ticket to the app
          echo "Stapling notarization ticket..."
          xcrun stapler staple "$APP_PATH"

          # Verify stapling
          echo "Verifying notarization..."
          xcrun stapler validate "$APP_PATH"
          rm notarization.zip

      - name: Create DMG
        run: |
          mkdir -p dmg-staging
          cp -R "$APP_PATH" dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -format ULMO -srcfolder dmg-staging -volname "Plezy" plezy-macos.dmg

      - name: Sign DMG for Sparkle (EdDSA)
        if: ${{ env.HAS_SPARKLE_KEY == 'true' }}
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          key=$(python3 tools/sparkle_sign.py --public-key)
          if [[ "$key" != "$SPARKLE_PUBLIC_KEY" ]]; then
            echo "SPARKLE_PRIVATE_KEY is the key of $key, not of Plezy's update key $SPARKLE_PUBLIC_KEY." >&2
            exit 1
          fi
          python3 tools/sparkle_sign.py plezy-macos.dmg > macos-ed-signature.txt
          stat -f%z plezy-macos.dmg > macos-dmg-size.txt

      - name: Attest macOS DMG
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: plezy-macos.dmg

      # The signature files are absent without SPARKLE_PRIVATE_KEY; the appcast then has no macOS enclosure.
      - name: Upload macOS DMG
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-dmg
          path: |
            plezy-macos.dmg
            macos-ed-signature.txt
            macos-dmg-size.txt

  # Each architecture's app images, built natively on its own runner (Compose's Skiko and libmpv are per-architecture
  # natives): the sideloaded image, which the installer and the portable archive take, and the store image, which the
  # MSIX takes. package-windows packs both architectures.
  build-windows:
    name: Build Windows (${{ matrix.arch }})
    needs: validate-trusted-ref
    if: ${{ inputs.build_windows }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      PLEZY_ANDROID: "false"
      HAS_SYMBOL_UPLOAD: ${{ secrets.BUGS_ADMIN_TOKEN != '' && github.repository == 'edde746/plezy' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 25 is the app's runtime (the desktop modules' toolchain); 27, listed last, runs Gradle and the shared
          # modules.
          - arch: x64
            runner: windows-latest
            java_distribution: temurin
            java_version: |
              25.0.4+101.0.LTS
              27.0.0+35
            jbr: ''
          # Temurin and Microsoft's OpenJDK have no Windows aarch64 build of 27 (Microsoft's has LTS releases only):
          # Zulu's 27 runs Gradle and the shared modules, and JetBrains Runtime 25 is the desktop modules' toolchain
          # and the app's runtime, checked by its sha512.
          - arch: arm64
            runner: windows-11-arm
            java_distribution: zulu
            # Zulu 27.0.1.1 (build 4) in setup-java's spelling: Azul lists no 27.0.1+9.
            java_version: 27.0.1+1.4
            jbr: jbrsdk-25.0.4.1-windows-aarch64-b635.75
            jbr_sha512: 034bfd183d3062f5fd8a35eb3461dd06b473eb3b6c348cac6c957f16128f1f4b9a718d38e743f14941772f3f884cc7f43af3f6d187a4537a1236ac7e0f081acd
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: ${{ matrix.java_distribution }}
          java-version: ${{ matrix.java_version }}
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Gradle finds it through installations.paths (the user home's gradle.properties, so no -P argument that
      # PowerShell could split at a dot) and may provision no other JDK (auto-download off).
      - name: Install JetBrains Runtime
        if: ${{ matrix.jbr != '' }}
        env:
          JBR: ${{ matrix.jbr }}
          JBR_SHA512: ${{ matrix.jbr_sha512 }}
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "$env:JBR.tar.gz"
          Invoke-WebRequest -Uri "https://cache-redirector.jetbrains.com/intellij-jbr/$env:JBR.tar.gz" -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA512 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $env:JBR_SHA512) { throw "$env:JBR.tar.gz has sha512 $actual, not $env:JBR_SHA512" }
          tar -xzf $archive -C $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw "tar failed with exit code $LASTEXITCODE" }
          $jbrHome = (Join-Path $env:RUNNER_TEMP $env:JBR).Replace('\', '/')
          New-Item -ItemType Directory -Force (Join-Path $env:USERPROFILE ".gradle") | Out-Null
          Add-Content -Path (Join-Path $env:USERPROFILE ".gradle\gradle.properties") -Value @(
            "org.gradle.java.installations.paths=$jbrHome"
            "org.gradle.java.installations.auto-download=false"
          )

      # The sideloaded build (the default flavor): the installer's and the portable archives'. Each image carries the
      # licence texts of the Windows app and libmpv's; the packaging scripts check them and each image's flavor.
      # PLEZY_FLAVOR is an environment variable, as PLEZY_ANDROID: PowerShell can split a -Pplezy.* argument at the dot.
      - name: Build the sideloaded app image
        env:
          PLEZY_FLAVOR: sideloaded
        run: ./gradlew --console=plain :app-desktop:createReleaseDistributable

      # libmpv's PDB (mpv-build's, pinned in mpv-build.lock.json, matched by its CodeView ID) and the DLL; the store
      # image ships the same libmpv.
      - name: Upload native symbols
        if: ${{ env.HAS_SYMBOL_UPLOAD == 'true' }}
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.BUGS_ADMIN_TOKEN }}
        run: tools/upload_symbols.sh windows desktop/app/build/compose/binaries/main-release/app/Plezy

      - name: Upload the sideloaded app image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-${{ matrix.arch }}-sideloaded
          path: desktop/app/build/compose/binaries/main-release/app/Plezy/
          if-no-files-found: error

      # The Microsoft Store's build.
      - name: Build the store app image
        env:
          PLEZY_FLAVOR: store
        run: ./gradlew --console=plain :app-desktop:createReleaseDistributable

      - name: Upload the store app image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-${{ matrix.arch }}-store
          path: desktop/app/build/compose/binaries/main-release/app/Plezy/
          if-no-files-found: error

  package-windows:
    name: Package Windows
    needs: [validate-trusted-ref, build-windows]
    if: ${{ inputs.build_windows }}
    runs-on: windows-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    env:
      VERSION: ${{ needs.validate-trusted-ref.outputs.version }}
      HAS_SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY != '' }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require Sparkle for a release
        if: ${{ inputs.release_tag != '' && env.HAS_SPARKLE_KEY != 'true' }}
        run: |
          Write-Error "Release $env:RELEASE_TAG needs the SPARKLE_PRIVATE_KEY secret."
          exit 1

      - name: Download the app images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: windows-*-{sideloaded,store}
          path: images

      # One installer for both architectures (it installs the machine's), a portable archive per architecture.
      - name: Build installer and portables
        run: >
          .\desktop\app\packaging\windows\build-installer.ps1
          -X64AppDir images\windows-x64-sideloaded -Arm64AppDir images\windows-arm64-sideloaded
          -Version $env:VERSION -OutputDir .

      # Unsigned on purpose: the Store re-signs the bundle during certification. See build-msix.ps1.
      - name: Build Store package (MSIX)
        run: >
          .\desktop\app\packaging\windows\build-msix.ps1
          -X64AppDir images\windows-x64-store -Arm64AppDir images\windows-arm64-store
          -Version $env:VERSION -OutputDir .

      # What the Windows app's updater checks before it runs the installer (the appcast's Windows enclosure).
      - name: Sign installer for Sparkle (EdDSA)
        if: ${{ env.HAS_SPARKLE_KEY == 'true' }}
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          $key = python tools/sparkle_sign.py --public-key
          if ($LASTEXITCODE -ne 0) { throw "sparkle_sign.py failed with exit code $LASTEXITCODE" }
          if ($key -ne $env:SPARKLE_PUBLIC_KEY) {
            throw "SPARKLE_PRIVATE_KEY is the key of $key, not of Plezy's update key $env:SPARKLE_PUBLIC_KEY."
          }
          $signature = python tools/sparkle_sign.py plezy-windows-installer.exe
          if ($LASTEXITCODE -ne 0) { throw "sparkle_sign.py failed with exit code $LASTEXITCODE" }
          Set-Content -Path win-ed-signature.txt -Value $signature -Encoding ascii -NoNewline
          Set-Content -Path win-installer-size.txt -Value (Get-Item plezy-windows-installer.exe).Length.ToString() -Encoding ascii -NoNewline

      - name: Attest Windows artifacts
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            plezy-windows-x64-portable.7z
            plezy-windows-arm64-portable.7z
            plezy-windows-installer.exe
            plezy-windows.msixbundle

      - name: Upload x64 portable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-x64-portable
          path: plezy-windows-x64-portable.7z

      - name: Upload arm64 portable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-arm64-portable
          path: plezy-windows-arm64-portable.7z

      # The signature files are absent without SPARKLE_PRIVATE_KEY; the appcast then has no Windows enclosure.
      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installer
          path: |
            plezy-windows-installer.exe
            win-ed-signature.txt
            win-installer-size.txt

      # Not attached to the GitHub release in create-release: a Store-identity package cannot be installed without the
      # Store's signature, so it is only a Partner Center upload.
      - name: Upload Store package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-msix
          path: plezy-windows.msixbundle

  build-linux:
    name: Build Linux (${{ matrix.arch }})
    needs: validate-trusted-ref
    if: ${{ inputs.build_linux }}
    runs-on: ${{ matrix.runner }}
    permissions:
      id-token: write
      attestations: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      PLEZY_ANDROID: "false"
      PLEZY_FLAVOR: sideloaded
      ARCH: ${{ matrix.arch }}
      VERSION: ${{ needs.validate-trusted-ref.outputs.version }}
      APP_IMAGE: desktop/app/build/compose/binaries/main-release/app/Plezy
      HAS_SYMBOL_UPLOAD: ${{ secrets.BUGS_ADMIN_TOKEN != '' && github.repository == 'edde746/plezy' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            25.0.4+101.0.LTS
            27.0.0+35
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # The app's runtime is JetBrains Runtime 25 (desktop/app/build.gradle.kts): this build, checked by its sha512.
      # Gradle finds it through installations.paths and may provision no other (auto-download off), so the foojay
      # resolver's newest JBR never replaces it.
      - name: Install JetBrains Runtime
        run: |
          case "$ARCH" in
            x64) jbr=jbrsdk-25.0.4.1-linux-x64-b635.75
              sha512=eb9806ffc8226a53ece596730de2a1d5923bee85cd0eeb0e30fa3f21a2c561b0dfe8c29d1c17d6675ba91649e9aa010d85f4fb428bfc96a035d104a23e4e2f50 ;;
            arm64) jbr=jbrsdk-25.0.4.1-linux-aarch64-b635.75
              sha512=f34ec0721110c2ee539854dd4f7ecb4c5f6700daa0f97bc996f18e0b44e359c75fd946799fbdda7c454978a1780f6f5f7348de51c18d44f5d2c482c60a3220a4 ;;
          esac
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$jbr.tar.gz" "https://cache-redirector.jetbrains.com/intellij-jbr/$jbr.tar.gz"
          echo "$sha512  $RUNNER_TEMP/$jbr.tar.gz" | sha512sum -c -
          tar -xzf "$RUNNER_TEMP/$jbr.tar.gz" -C "$RUNNER_TEMP"
          echo "JBR_HOME=$RUNNER_TEMP/$jbr" >> "$GITHUB_ENV"

      - name: Build the app image
        run: >
          ./gradlew --console=plain -Porg.gradle.java.installations.paths="$JBR_HOME"
          -Porg.gradle.java.installations.auto-download=false :app-desktop:createReleaseDistributable

      # libmpv's unstripped copy (mpv-build's, pinned in mpv-build.lock.json, matched by build ID).
      - name: Upload native symbols
        if: ${{ env.HAS_SYMBOL_UPLOAD == 'true' }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.BUGS_ADMIN_TOKEN }}
        run: tools/upload_symbols.sh linux "$APP_IMAGE"

      # mpv-build's libmpv is built on Ubuntu 24.04 (this runner) and links these under sonames the Flatpak runtime
      # lacks; build-flatpak.py puts them in /app/lib and refuses a package whose copyright file (its licence) differs
      # from the app's copy in licenses/linux. Exact builds from Launchpad, which keeps every published one, checked by
      # sha256: new versions (an Ubuntu update or a new mpv-build) are new lines here, and new copyright files there.
      - name: Fetch libmpv's Ubuntu libraries
        run: |
          mkdir -p ubuntu-debs ubuntu-libs
          cd ubuntu-debs
          case "$ARCH" in x64) deb_arch=amd64 ;; arm64) deb_arch=arm64 ;; esac
          grep "_$deb_arch\.deb\$" > SHA256SUMS << EOF
          b030bc0bea32fe27dfb70a31e14491b6ab767379811877e6497af28338eab5d8  liblua5.2-0_5.2.4-3build2_amd64.deb
          eb65d35b3cee83aeecaa4ccdbfbde2452d5bb394237f4668f1bb6cc154e61ff0  libmujs3_1.3.3-3build2_amd64.deb
          a3bfce18d53aa9d635d899f1f555e84bbbf2c859d80cef3b4eb1c36b2c772026  libdisplay-info1_0.1.1-2build1_amd64.deb
          36ee08b00b1ee5018b2fce02881b7d2d73c9b4e32990bde3388400d86c48126a  libbz2-1.0_1.0.8-5.1ubuntu0.1_amd64.deb
          0b813a3869bb39f65e9cdbf8c59bfd48ec2a872df7776b176d7641a27d0abb76  liblua5.2-0_5.2.4-3build2_arm64.deb
          e76fbf1797e6bccf7aa57a99118bb73de02e606f1d865a2237d092203c1b67fe  libmujs3_1.3.3-3build2_arm64.deb
          cb9622f90d68ef13e851e8f95dd4a6bd54ae5d746f7911ffd0110b6ac0781680  libdisplay-info1_0.1.1-2build1_arm64.deb
          1a92811105f89bf948a629de99715ef23941ef93c901e0942883029069db3f94  libbz2-1.0_1.0.8-5.1ubuntu0.1_arm64.deb
          EOF
          while read -r _ deb; do
            curl -fsSL --retry 3 -o "$deb" "https://launchpad.net/ubuntu/+archive/primary/+files/$deb"
          done < SHA256SUMS
          sha256sum -c SHA256SUMS
          for deb in *.deb; do dpkg-deb -x "$deb" ../ubuntu-libs; done

      # fpm and the package formats' tools for build-packages.py, the AppImage's (zsync, file), and the libraries the
      # app image links that the packages declare as dependencies rather than carry: build-packages.py's host
      # dependency guard resolves every library the image needs (ldd) and fails on one missing here.
      - name: Install Linux packaging tools
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
            ruby rpm binutils libarchive-tools zstd xz-utils zsync file curl \
            liblua5.2-0 libmujs3 libdisplay-info1 libbz2-1.0 libasound2t64 libdrm2 libegl1 libfontconfig1 \
            libfreetype6 libfribidi0 libgbm1 libgl1 libglib2.0-0t64 libgnutls30t64 libharfbuzz0b liblcms2-2 \
            libpipewire-0.3-0t64 libpulse0 libsecret-1-0 libstdc++6 libva-drm2 libva-wayland2 libva-x11-2 libva2 \
            libwayland-client0 libwayland-cursor0 libwayland-egl1 libx11-6 libxext6 libxi6 libxkbcommon0 libxrandr2 \
            libxrender1 libxtst6 zlib1g
          sudo gem install fpm --version 1.17.0 --no-document

      # deb, rpm, pacman and the tarball, from the one staged image (/opt/plezy, /usr/bin/plezy); the script checks the
      # image's host dependencies before fpm and reads each package's metadata back after.
      - name: Build Linux packages
        run: |
          python3 desktop/app/packaging/linux/build-packages.py --app "$APP_IMAGE" --arch "$ARCH" \
            --version "$VERSION" --output "$GITHUB_WORKSPACE"

      # Its update information names this repository's latest release
      # (gh-releases-zsync|edde746|plezy|latest|plezy-linux-<arch>.AppImage.zsync), which AppImageUpdate and Gear
      # Lever follow, so they see a release once it is published. The script fetches its pinned appimagetool and
      # runtime and fails unless the AppImage reports that line and the .zsync exists.
      - name: Build AppImage
        run: |
          bash desktop/app/packaging/linux/build-appimage.sh --app "$APP_IMAGE" --arch "$ARCH" \
            --output "$GITHUB_WORKSPACE"

      # The SDK and Platform the bundle is built against, moved to these commits of Flathub's 26.08 branch. The bundle
      # itself names the branch, so an installed Plezy runs on whatever 26.08 its user has. unzip: flatpak-builder
      # unpacks the manifest's Noto Sans release with it, and only recommends it.
      - name: Install Flatpak packaging dependencies
        run: |
          case "$ARCH" in
            x64) flatpak_arch=x86_64
              platform=e7f7b0fb20662fe92e4eac65d58a57019cefae45a39559c4b50440a88acc0491
              sdk=3311c13c67b602315c39cf5310de129dd3460d04b6c8cf5be1b2cbc42c51abd7 ;;
            arm64) flatpak_arch=aarch64
              platform=b1638b75d1c66cc77ca956cc56ee3cc3520f917c167fac9ddd603294beefc086
              sdk=c49710941b05177c7a69cfef43a97547b9bed24a7ad1f52cd4ba26cdd9bc1665 ;;
          esac
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder unzip
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive -y flathub org.freedesktop.Platform//26.08 org.freedesktop.Sdk//26.08
          flatpak update --user --noninteractive -y --commit="$platform" "org.freedesktop.Platform/$flatpak_arch/26.08"
          flatpak update --user --noninteractive -y --commit="$sdk" "org.freedesktop.Sdk/$flatpak_arch/26.08"
          check() {
            installed=$(flatpak info --user --show-commit "org.freedesktop.$1/$flatpak_arch/26.08")
            [[ "$installed" == "$2" ]] || { echo "org.freedesktop.$1 is at $installed, not $2" >&2; exit 1; }
          }
          check Platform "$platform"
          check Sdk "$sdk"

      - name: Build Flatpak bundle
        run: |
          python3 desktop/app/packaging/linux/build-flatpak.py --app "$APP_IMAGE" \
            --libs ubuntu-libs --arch "$ARCH" --output "$GITHUB_WORKSPACE"

      - name: Verify installed Flatpak runtime dependencies
        run: |
          flatpak install --user --noninteractive -y "plezy-linux-$ARCH.flatpak"
          dbus-run-session -- python3 desktop/app/packaging/linux/check-flatpak.py --arch "$ARCH"

      - name: Attest Linux ${{ matrix.arch }} artifacts
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            plezy-linux-${{ matrix.arch }}.tar.gz
            plezy-linux-${{ matrix.arch }}.deb
            plezy-linux-${{ matrix.arch }}.rpm
            plezy-linux-${{ matrix.arch }}.pkg.tar.zst
            plezy-linux-${{ matrix.arch }}.flatpak
            plezy-linux-${{ matrix.arch }}.AppImage
            plezy-linux-${{ matrix.arch }}.AppImage.zsync

      - name: Upload Linux ${{ matrix.arch }} artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-${{ matrix.arch }}
          path: |
            plezy-linux-${{ matrix.arch }}.tar.gz
            plezy-linux-${{ matrix.arch }}.deb
            plezy-linux-${{ matrix.arch }}.rpm
            plezy-linux-${{ matrix.arch }}.pkg.tar.zst
            plezy-linux-${{ matrix.arch }}.flatpak
            plezy-linux-${{ matrix.arch }}.AppImage
            plezy-linux-${{ matrix.arch }}.AppImage.zsync
          if-no-files-found: error

  create-release:
    name: Create draft release
    needs: [validate-trusted-ref, build-android, build-ios, build-macos, build-windows, package-windows, build-linux]
    # Every platform requested and every job above succeeded: a job that never ran (skipped) has no artifacts, so a
    # skipped one stops the draft as a failed or cancelled one does.
    if: ${{ always() && needs.validate-trusted-ref.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') && inputs.build_android && inputs.build_ios && inputs.build_macos && inputs.build_windows && inputs.build_linux && inputs.release_tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.validate-trusted-ref.outputs.version }}
      BUILD_NUMBER: ${{ needs.validate-trusted-ref.outputs.build_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            tools/appcast.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '{android-apk,ios-ipa,macos-dmg,windows-x64-portable,windows-arm64-portable,windows-installer,linux-x64,linux-arm64}'
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      # The feed the macOS and Windows apps read (from the appcast branch, once update-packages.yml copies it there).
      # sparkle:version is compared with the installed app's build number (CURRENT_PROJECT_VERSION).
      - name: Generate appcast.xml
        run: |
          python3 tools/appcast.py --version "$VERSION" --build-number "$BUILD_NUMBER" \
            --macos-dir artifacts/macos-dmg --windows-dir artifacts/windows-installer --output appcast.xml
          echo "Generated appcast.xml:"
          cat appcast.xml

      # The release's files, one per line, for SHA256SUMS and the release alike.
      - name: List release files
        id: files
        run: |
          files=(
            artifacts/android-apk/plezy-android-arm64-v8a.tar.gz
            artifacts/android-apk/plezy-android-armeabi-v7a.tar.gz
            artifacts/android-apk/plezy-android-x86_64.tar.gz
            artifacts/ios-ipa/plezy-ios.ipa
            artifacts/macos-dmg/plezy-macos.dmg
            artifacts/windows-x64-portable/plezy-windows-x64-portable.7z
            artifacts/windows-arm64-portable/plezy-windows-arm64-portable.7z
            artifacts/windows-installer/plezy-windows-installer.exe
          )
          for arch in x64 arm64; do
            for ext in tar.gz deb rpm pkg.tar.zst flatpak AppImage AppImage.zsync; do
              files+=("artifacts/linux-$arch/plezy-linux-$arch.$ext")
            done
          done
          files+=(appcast.xml)
          # The sha256 of every attached file, in `sha256sum -c` form.
          for f in "${files[@]}"; do (cd "$(dirname "$f")" && sha256sum "$(basename "$f")"); done > SHA256SUMS
          cat SHA256SUMS
          {
            echo 'list<<EOF'
            printf '%s\n' "${files[@]}" SHA256SUMS
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: ${{ steps.files.outputs.list }}
          draft: true
          prerelease: false
          name: ${{ inputs.release_tag }}
          tag_name: ${{ inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
