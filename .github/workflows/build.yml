# ng-runner-policy: private-jit-only-v1
# packer-windows-jit-v1
name: PlezyNG Release
run-name: ${{ inputs.action == 'release' && format('action:{0}:pool:{1}:tag:v{2}', inputs.action, inputs.runner_pool, inputs.build_version) || format('action:{0}:pool:{1}', inputs.action, inputs.runner_pool) }}

on:
  workflow_dispatch:
    inputs:
      action:
        description: Build artifacts without changing a release, or create/update the draft release
        required: true
        type: choice
        options:
          - build
          - release
      runner_pool:
        description: Runner pool for this build
        required: true
        type: choice
        options:
          - private
      mode:
        description: Select all release platforms or a platform-specific validation build
        required: true
        type: choice
        options:
          - release
          - webos-validation
          - macos-validation
        default: release
      build_version:
        description: Semantic version for artifact names; release requires the existing v* tag to point to this exact main commit
        required: false
        type: string
      include_webos_build:
        description: Build and verify the experimental ARM webOS candidate in this workflow run
        required: true
        type: boolean
        default: true
      include_webos_release:
        description: >-
          Include the LG webOS IPK in a public release after its exact artifact
          and redistribution gates are approved. This does not control whether
          the candidate is built.
        required: true
        type: boolean
        default: false
      include_tizen_build:
        description: Build the experimental ARM Samsung Tizen tester candidate in this workflow run
        required: true
        type: boolean
        default: true
      prepare_homebrew_cask:
        description: Require signed and notarized macOS validation; on release runs, also generate a Homebrew Cask candidate
        required: true
        type: boolean
        default: false
env:
  # Only place this workflow names the SDK; .github/actions/setup-flutter-git pins the same release.
  FLUTTER_VERSION: "3.47.1"
  # Shared by every release build command.
  RELEASE_DART_DEFINES: --dart-define=ENABLE_UPDATE_CHECK=true --dart-define=GIT_COMMIT=${{ github.sha }}
  TRUSTED_BUILD_CACHE_VERSION: trusted-build-v1
  LINUX_APT_PACKAGES: >
    clang cmake meson ninja-build pkg-config nasm libgtk-3-dev libsecret-1-dev libevdev-dev liblzma-dev
    libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-libav gstreamer1.0-plugins-bad gstreamer1.0-plugins-good
    libstdc++-12-dev libasound2-dev libass-dev libfreetype-dev libfontconfig-dev libfribidi-dev
    libharfbuzz-dev libepoxy-dev libegl-dev libgl-dev libgnutls28-dev libpipewire-0.3-dev
    libva-dev libvdpau-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev
    libxss-dev libxpresent-dev libxkbcommon-dev libpulse-dev libdbus-1-dev libdrm-dev
    libdisplay-info-dev libgbm-dev libwayland-dev wayland-protocols liblcms2-dev libmujs-dev liblua5.2-dev
    ruby ruby-dev rubygems build-essential rpm libarchive-tools imagemagick libcurl4-openssl-dev

jobs:
  validate-trusted-ref:
    name: Validate release request
    if: ${{ inputs.runner_pool == 'private' && (inputs.action == 'build' || inputs.action == 'release') }}
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-plezyng","ng-main-run-{0}","gha-{0}-validate-trusted-ref"]}}', github.run_id)) }}
    outputs:
      action: ${{ steps.request.outputs.action }}
      runner_pool: ${{ steps.request.outputs.runner_pool }}
      mode: ${{ steps.request.outputs.mode }}
      release_tag: ${{ steps.request.outputs.release_tag }}
      version: ${{ steps.request.outputs.version }}
      include_webos_build: ${{ steps.request.outputs.include_webos_build }}
      include_webos_release: ${{ steps.request.outputs.include_webos_release }}
      include_tizen_build: ${{ steps.request.outputs.include_tizen_build }}
      prepare_homebrew_cask: ${{ steps.request.outputs.prepare_homebrew_cask }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release request
        id: request
        shell: bash
        env:
          ACTION_INPUT: ${{ inputs.action }}
          RUNNER_POOL_INPUT: ${{ inputs.runner_pool }}
          MODE_INPUT: ${{ inputs.mode }}
          BUILD_VERSION_INPUT: ${{ inputs.build_version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INCLUDE_WEBOS_BUILD_INPUT: ${{ inputs.include_webos_build }}
          INCLUDE_WEBOS_RELEASE_INPUT: ${{ inputs.include_webos_release }}
          INCLUDE_TIZEN_BUILD_INPUT: ${{ inputs.include_tizen_build }}
          PREPARE_HOMEBREW_CASK_INPUT: ${{ inputs.prepare_homebrew_cask }}
        run: |
          set -euo pipefail
          ACTION="$ACTION_INPUT"
          RUNNER_POOL="$RUNNER_POOL_INPUT"
          MODE="$MODE_INPUT"
          INCLUDE_WEBOS_BUILD="$INCLUDE_WEBOS_BUILD_INPUT"
          INCLUDE_WEBOS_RELEASE="$INCLUDE_WEBOS_RELEASE_INPUT"
          INCLUDE_TIZEN_BUILD="$INCLUDE_TIZEN_BUILD_INPUT"
          PREPARE_HOMEBREW_CASK="$PREPARE_HOMEBREW_CASK_INPUT"
          if [[ "$ACTION" != "build" && "$ACTION" != "release" ]]; then
            echo "Unsupported action: $ACTION" >&2
            exit 1
          fi
          if [[ "$RUNNER_POOL" != "private" ]]; then
            echo "This workflow currently supports only the private runner pool." >&2
            exit 1
          fi
          if [[ "$MODE" != "release" && "$MODE" != "webos-validation" && "$MODE" != "macos-validation" ]]; then
            echo "Unsupported platform mode: $MODE" >&2
            exit 1
          fi
          if [[ "$MODE" == "webos-validation" && "$ACTION" != "build" ]]; then
            echo "webOS-only validation requires the build action." >&2
            exit 1
          fi
          if [[ "$MODE" == "macos-validation" && "$ACTION" != "build" ]]; then
            echo "macOS-only validation requires the build action." >&2
            exit 1
          fi
          if [[ "$ACTION" == "release" ]]; then
            if [[ "$REF_TYPE" != "branch" || "$REF_NAME" != "main" ]]; then
              echo "The release action must dispatch from refs/heads/main so the private main-ref runner policy applies." >&2
              exit 1
            fi
            VERSION="$BUILD_VERSION_INPUT"
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "The release action requires build_version=MAJOR.MINOR.PATCH." >&2
              exit 1
            fi
            RELEASE_TAG="v$VERSION"
          else
            RELEASE_TAG="$BUILD_VERSION_INPUT"
            if [[ -z "$RELEASE_TAG" && ( "$MODE" == "release" || "$MODE" == "macos-validation" ) ]]; then
              RELEASE_TAG=$(python3 scripts/pubspec_version.py pubspec.yaml)
              RELEASE_TAG=${RELEASE_TAG%%+*}
            fi
            VERSION="$RELEASE_TAG"
          fi
          if [[ "$PREPARE_HOMEBREW_CASK" != "true" && "$PREPARE_HOMEBREW_CASK" != "false" ]]; then
            echo "prepare_homebrew_cask must be true or false." >&2
            exit 1
          fi
          if [[ "$PREPARE_HOMEBREW_CASK" == "true" && "$MODE" != "release" && "$MODE" != "macos-validation" ]]; then
            echo "Signed Homebrew validation requires release or macos-validation mode." >&2
            exit 1
          fi
          if [[ "$MODE" == "macos-validation" && "$PREPARE_HOMEBREW_CASK" != "true" ]]; then
            echo "macos-validation mode requires prepare_homebrew_cask=true." >&2
            exit 1
          fi
          if [[ "$MODE" == "webos-validation" ]]; then
            RELEASE_TAG=""
            VERSION=""
            INCLUDE_WEBOS_BUILD=true
            INCLUDE_WEBOS_RELEASE=false
            INCLUDE_TIZEN_BUILD=false
          elif [[ "$MODE" == "macos-validation" ]]; then
            INCLUDE_WEBOS_BUILD=false
            INCLUDE_WEBOS_RELEASE=false
            INCLUDE_TIZEN_BUILD=false
          elif [[ "$INCLUDE_WEBOS_RELEASE" != "true" && "$INCLUDE_WEBOS_RELEASE" != "false" ]]; then
            echo "include_webos_release must be true or false." >&2
            exit 1
          fi
          if [[ "$MODE" == "release" && "$INCLUDE_WEBOS_BUILD" != "true" && "$INCLUDE_WEBOS_BUILD" != "false" ]]; then
            echo "include_webos_build must be true or false." >&2
            exit 1
          fi
          if [[ "$MODE" == "release" && "$INCLUDE_TIZEN_BUILD" != "true" && "$INCLUDE_TIZEN_BUILD" != "false" ]]; then
            echo "include_tizen_build must be true or false." >&2
            exit 1
          fi
          {
            echo "action=$ACTION"
            echo "runner_pool=$RUNNER_POOL"
            echo "mode=$MODE"
            echo "release_tag=$RELEASE_TAG"
            echo "version=$VERSION"
            echo "include_webos_build=$INCLUDE_WEBOS_BUILD"
            echo "include_webos_release=$INCLUDE_WEBOS_RELEASE"
            echo "include_tizen_build=$INCLUDE_TIZEN_BUILD"
            echo "prepare_homebrew_cask=$PREPARE_HOMEBREW_CASK"
          } >> "$GITHUB_OUTPUT"

      - name: Require the main branch for builds
        if: ${{ inputs.action == 'build' }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Build actions may only run from refs/heads/main." >&2
            exit 1
          fi

      - name: Require the release tag to match the trusted main commit
        if: ${{ inputs.action == 'release' }}
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.request.outputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Release actions must run from refs/heads/main." >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release actions require an exact vMAJOR.MINOR.PATCH tag." >&2
            exit 1
          fi
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          release_commit=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          if [[ "$release_commit" != "$GITHUB_SHA" ]]; then
            echo "Release tag $RELEASE_TAG resolves to $release_commit, not dispatched main commit $GITHUB_SHA." >&2
            exit 1
          fi
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "Release tags must point to a commit on main." >&2
            exit 1
          fi

      - name: Validate action and runner pool
        shell: bash
        env:
          ACTION: ${{ steps.request.outputs.action }}
          RUNNER_POOL: ${{ steps.request.outputs.runner_pool }}
          MODE: ${{ steps.request.outputs.mode }}
        run: |
          set -euo pipefail
          if [[ "$ACTION" != "build" && "$ACTION" != "release" ]]; then
            echo "Unsupported action: $ACTION" >&2
            exit 1
          fi
          if [[ "$RUNNER_POOL" != "private" ]]; then
            echo "This workflow currently supports only the private runner pool." >&2
            exit 1
          fi
          if [[ "$MODE" != "release" && "$MODE" != "webos-validation" && "$MODE" != "macos-validation" ]]; then
            echo "Unsupported platform mode: $MODE" >&2
            exit 1
          fi
          if [[ "$MODE" == "webos-validation" && "$ACTION" != "build" ]]; then
            echo "webOS-only validation requires the build action." >&2
            exit 1
          fi
          if [[ "$MODE" == "macos-validation" && "$ACTION" != "build" ]]; then
            echo "macOS-only validation requires the build action." >&2
            exit 1
          fi
          if [[ "${{ steps.request.outputs.include_webos_release }}" == "true" && "${{ steps.request.outputs.include_webos_build }}" != "true" ]]; then
            echo "A public webOS release requires building the webOS candidate." >&2
            exit 1
          fi
          if [[ "${{ steps.request.outputs.include_webos_release }}" == "true" && "$ACTION" != "release" ]]; then
            echo "Public webOS inclusion requires action=release." >&2
            exit 1
          fi

      - name: Validate release tag before building
        if: ${{ steps.request.outputs.mode == 'release' }}
        env:
          ACTION: ${{ steps.request.outputs.action }}
          RELEASE_TAG: ${{ steps.request.outputs.release_tag }}
          VERSION: ${{ steps.request.outputs.version }}
        run: |
          set -euo pipefail
          PACKAGE_VERSION=$(python3 scripts/pubspec_version.py pubspec.yaml)
          PACKAGE_VERSION=${PACKAGE_VERSION%%+*}
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version must use semantic versioning: $VERSION" >&2
            exit 1
          fi
          if [[ "$VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "Release tag $RELEASE_TAG does not match pubspec version $PACKAGE_VERSION." >&2
            exit 1
          fi
          if [[ "$ACTION" == "release" && "$RELEASE_TAG" != "v$PACKAGE_VERSION" ]]; then
            echo "Selected release tag $RELEASE_TAG does not match v$PACKAGE_VERSION." >&2
            exit 1
          fi
          if [[ "$ACTION" == "build" && "$VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "Requested build version $VERSION does not match pubspec version $PACKAGE_VERSION." >&2
            exit 1
          fi

      - name: Require successful CI for this commit
        if: ${{ steps.request.outputs.mode == 'release' && steps.request.outputs.action == 'release' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: python3 scripts/verify_release_ci.py

      - name: Require approval for the exact webOS release artifact
        if: ${{ steps.request.outputs.mode == 'release' && steps.request.outputs.include_webos_release == 'true' }}
        env:
          RELEASE_TAG: ${{ steps.request.outputs.version }}
        run: >-
          python3 tools/webos/check_release_eligibility.py
          --preflight
          --version "$RELEASE_TAG"

      - name: Validate webOS-only mode input
        if: ${{ steps.request.outputs.mode == 'webos-validation' }}
        run: |
          echo "This manual run builds only the WebOS ARM package on the private Linux JIT route."
          echo "No draft release is created."

      - name: Validate macOS-only mode input
        if: ${{ steps.request.outputs.mode == 'macos-validation' }}
        run: |
          echo "This manual run builds only the macOS app and checks signing, notarization, and Gatekeeper."
          echo "No draft release is created."

  build-android:
    if: ${{ inputs.runner_pool == 'private' && (inputs.action == 'build' || inputs.action == 'release') && needs.validate-trusted-ref.outputs.runner_pool == 'private' && (needs.validate-trusted-ref.outputs.action == 'build' || needs.validate-trusted-ref.outputs.action == 'release') && needs.validate-trusted-ref.outputs.mode == 'release' }}
    needs: validate-trusted-ref
    timeout-minutes: 360
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-plezyng","ng-main-run-{0}","gha-{0}-build-android"]}}', github.run_id)) }}
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Java
        if: ${{ needs.validate-trusted-ref.outputs.mode == 'release' }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Configure Java downloads for the private JIT proxy
        if: ${{ needs.validate-trusted-ref.outputs.mode == 'release' }}
        run: python3 scripts/prepare_android_sdk.py proxy

      - name: Setup Android SDK
        if: ${{ needs.validate-trusted-ref.outputs.mode == 'release' }}
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          cmdline-tools-version: '15859902'
          log-accepted-android-sdk-licenses: false

      - name: Install the pinned Android SDK, NDK, and CMake
        if: ${{ needs.validate-trusted-ref.outputs.mode == 'release' }}
        run: python3 scripts/prepare_android_sdk.py install

      - name: Setup Flutter
        if: ${{ needs.validate-trusted-ref.outputs.mode == 'release' }}
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: "${{ env.TRUSTED_BUILD_CACHE_VERSION }}-flutter-:os:-:channel:-:version:-:arch:-:hash:"
          pub-cache: false

      - name: Cache Pub dependencies
        if: ${{ needs.validate-trusted-ref.outputs.mode == 'release' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.pub-cache
          key: ${{ env.TRUSTED_BUILD_CACHE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-pub-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}

      - name: Cache Gradle
        if: ${{ needs.validate-trusted-ref.outputs.mode == 'release' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ env.TRUSTED_BUILD_CACHE_VERSION }}-${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Install dependencies
        if: ${{ needs.validate-trusted-ref.outputs.mode == 'release' }}
        run: flutter pub get --enforce-lockfile --no-example

      - name: Configure Android signing
        id: android-signing
        if: ${{ needs.validate-trusted-ref.outputs.mode == 'release' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          values=("$ANDROID_KEYSTORE_BASE64" "$ANDROID_STORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS")
          configured=0
          missing=0
          for value in "${values[@]}"; do
            if [[ -n "$value" ]]; then configured=$((configured + 1)); else missing=$((missing + 1)); fi
          done
          if (( configured == 0 )); then
            echo "Android signing secrets are not configured; this release APK will use the CI debug key."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if (( missing != 0 )); then
            echo "Android signing secrets are incomplete; configure all four Android signing secrets." >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties << EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Configure Gradle to use the private JIT proxy
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import os
          from urllib.parse import urlsplit

          proxy = os.environ.get("HTTPS_PROXY") or os.environ.get("https_proxy")
          if not proxy:
              raise SystemExit("The private JIT HTTPS proxy is required for Gradle downloads.")
          parsed = urlsplit(proxy if "://" in proxy else f"http://{proxy}")
          if not parsed.hostname or not parsed.port or parsed.username or parsed.password:
              raise SystemExit("The private JIT HTTPS proxy URL is invalid for Gradle.")
          options = [
              f"-Dhttp.proxyHost={parsed.hostname}",
              f"-Dhttp.proxyPort={parsed.port}",
              f"-Dhttps.proxyHost={parsed.hostname}",
              f"-Dhttps.proxyPort={parsed.port}",
          ]
          existing = os.environ.get("GRADLE_OPTS", "").strip()
          print("GRADLE_OPTS=" + " ".join(([existing] if existing else []) + options))
          PY

      - name: Build APKs
        if: ${{ needs.validate-trusted-ref.outputs.mode == 'release' }}
        run: flutter build apk --release --split-per-abi ${{ env.RELEASE_DART_DEFINES }} --obfuscate --split-debug-info=debug-info/android-apk --extra-gen-snapshot-options=--save-obfuscation-map=debug-info/android-apk/obfuscation.map.json

      - name: Package APKs
        if: ${{ needs.validate-trusted-ref.outputs.mode == 'release' }}
        run: |
          tar -czf plezy-android-arm64-v8a.tar.gz -C build/app/outputs/flutter-apk app-arm64-v8a-release.apk --transform 's/app-arm64-v8a-release.apk/plezy.apk/'
          tar -czf plezy-android-armeabi-v7a.tar.gz -C build/app/outputs/flutter-apk app-armeabi-v7a-release.apk --transform 's/app-armeabi-v7a-release.apk/plezy.apk/'
          tar -czf plezy-android-x86_64.tar.gz -C build/app/outputs/flutter-apk app-x86_64-release.apk --transform 's/app-x86_64-release.apk/plezy.apk/'

      - name: Build signed Android App Bundle
        if: ${{ needs.validate-trusted-ref.outputs.mode == 'release' && steps.android-signing.outputs.configured == 'true' }}
        run: |
          flutter build appbundle --release ${{ env.RELEASE_DART_DEFINES }} --dart-define=SUPPORTER_MODE=iap --obfuscate --split-debug-info=debug-info/android-play
          cp build/app/outputs/bundle/release/app-release.aab plezyng-android-play.aab

      - name: Build signed Amazon Appstore APK
        if: ${{ needs.validate-trusted-ref.outputs.mode == 'release' && steps.android-signing.outputs.configured == 'true' }}
        run: |
          AMAZON=1 ORG_GRADLE_PROJECT_openiapStore=amazon flutter build apk --release ${{ env.RELEASE_DART_DEFINES }} --dart-define=SUPPORTER_MODE=iap --dart-define=AMAZON_STORE=true --obfuscate --split-debug-info=debug-info/android-amazon
          cp build/app/outputs/flutter-apk/app-release.apk plezyng-amazon-firetv.apk

      - name: Clean up keystore
        if: ${{ always() && needs.validate-trusted-ref.outputs.mode == 'release' }}
        run: rm -f android/app/upload-keystore.jks android/key.properties

      - name: Attest APKs
        if: ${{ needs.validate-trusted-ref.outputs.mode == 'release' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            plezy-android-arm64-v8a.tar.gz
            plezy-android-armeabi-v7a.tar.gz
            plezy-android-x86_64.tar.gz

      - name: Attest Android App Bundle
        if: ${{ needs.validate-trusted-ref.outputs.mode == 'release' && steps.android-signing.outputs.configured == 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            plezyng-android-play.aab
            plezyng-amazon-firetv.apk

      - name: Upload APKs
        if: ${{ needs.validate-trusted-ref.outputs.mode == 'release' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-apk
          path: |
            plezy-android-arm64-v8a.tar.gz
            plezy-android-armeabi-v7a.tar.gz
            plezy-android-x86_64.tar.gz
            plezyng-android-play.aab
            plezyng-amazon-firetv.apk
          if-no-files-found: warn

  build-webos:
    if: ${{ inputs.runner_pool == 'private' && (inputs.action == 'build' || inputs.action == 'release') && needs.validate-trusted-ref.outputs.runner_pool == 'private' && (needs.validate-trusted-ref.outputs.action == 'build' || needs.validate-trusted-ref.outputs.action == 'release') && (needs.validate-trusted-ref.outputs.mode == 'webos-validation' || (needs.validate-trusted-ref.outputs.mode == 'release' && needs.validate-trusted-ref.outputs.include_webos_build == 'true')) }}
    needs: validate-trusted-ref
    name: Build WebOS TV package (ARMv7)
    timeout-minutes: 360
    runs-on:
      group: ng-shared-main-jit
      labels:
        - self-hosted
        - linux
        - x64
        - ng-shared-main-plezyng
        - ${{ format('ng-main-run-{0}', github.run_id) }}
        - ${{ format('gha-{0}-build-webos', github.run_id) }}
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify private WebOS output storage
        run: python3 tools/webos/retain_private_candidate.py --preflight

      - name: Test WebOS packaging and release gates
        env:
          PLEZY_WEBOS_TEST_TMP: ${{ runner.temp }}/plezy-webos-tests
        run: |
          mkdir -p "$PLEZY_WEBOS_TEST_TMP"
          python3 -m unittest discover -s tools/webos/tests -v

      - name: Install WebOS host prerequisites
        shell: bash
        run: |
          set -euo pipefail
          free_kib="$(df -Pk "$RUNNER_TEMP" | awk 'NR == 2 { print $4 }')"
          minimum_free_kib=$((60 * 1024 * 1024))
          if [[ ! "$free_kib" =~ ^[0-9]+$ ]] || (( free_kib < minimum_free_kib )); then
            echo "The WebOS engine build needs 60 GiB free under RUNNER_TEMP before toolchain installation." >&2
            df -h "$RUNNER_TEMP" >&2
            exit 1
          fi
          packages=(build-essential clang cmake curl file git-lfs libgtk-3-dev libsecret-1-dev liblzma-dev ninja-build pkg-config unzip libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-libav gstreamer1.0-plugins-bad gstreamer1.0-plugins-good)
          for attempt in 1 2 3; do
            if sudo apt-get update -o Acquire::Retries=3 \
              && sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 "${packages[@]}"; then
              break
            fi
            if (( attempt == 3 )); then exit 1; fi
            sudo apt-get clean
            sudo rm -rf /var/lib/apt/lists/*
            sleep $((attempt * 15))
          done
          git lfs version
          cmake --version
          pkg-config --modversion gtk+-3.0
          clang --version

      - name: Setup pinned WebOS Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14.8"
          architecture: "x64"

      - name: Install and verify pinned WebOS Ninja
        shell: bash
        run: |
          set -euo pipefail
          python3.14 --version
          archive="$RUNNER_TEMP/ninja-linux.zip"
          tools_dir="$RUNNER_TEMP/webos-host-tools"
          mkdir -p "$tools_dir"
          curl --fail --location --retry 3 --connect-timeout 30 \
            --output "$archive" \
            https://github.com/ninja-build/ninja/releases/download/v1.13.2/ninja-linux.zip
          expected_archive="$(python3 -c 'import json; print(json.load(open("tools/webos/compatibility.json"))["engineBuild"]["ninjaArchiveSha256"])')"
          printf '%s  %s\n' "$expected_archive" "$archive" | sha256sum --check --status
          unzip -q "$archive" -d "$tools_dir"
          chmod 0755 "$tools_dir/ninja"
          expected_binary="$(python3 -c 'import json; print(json.load(open("tools/webos/compatibility.json"))["engineBuild"]["ninjaSha256"])')"
          printf '%s  %s\n' "$expected_binary" "$tools_dir/ninja" | sha256sum --check --status
          test "$("$tools_dir/ninja" --version)" = "1.13.2"
          echo "WEBOS_NINJA_BIN=$tools_dir/ninja" >> "$GITHUB_ENV"

      - name: Build and verify the WebOS ARM package
        id: webos-build
        run: bash tools/webos/build_release_candidate.sh
        env:
          PLEZYNG_WEBOS_TASK_ROOT: ${{ runner.temp }}/plezyng-webos-${{ github.run_id }}
          PLEZY_WEBOS_RELEASE_BUILD: ${{ needs.validate-trusted-ref.outputs.mode == 'release' && needs.validate-trusted-ref.outputs.include_webos_release == 'true' }}

      - name: Retain verified WebOS candidate for private device testing
        env:
          OUTPUT_DIR: ${{ steps.webos-build.outputs.output_dir }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/webos/retain_private_candidate.py \
            --source-dir "$OUTPUT_DIR" \
            --version "$(python3 scripts/pubspec_version.py pubspec.yaml)"

      - name: Verify the exact approved WebOS IPK
        if: ${{ needs.validate-trusted-ref.outputs.mode == 'release' && needs.validate-trusted-ref.outputs.include_webos_release == 'true' }}
        env:
          OUTPUT_DIR: ${{ steps.webos-build.outputs.output_dir }}
          RELEASE_TAG: ${{ needs.validate-trusted-ref.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ipks < <(find "$OUTPUT_DIR" -maxdepth 1 -type f -name '*.ipk' -print)
          if [[ "${#ipks[@]}" -ne 1 ]]; then
            echo "Expected exactly one WebOS IPK in the verified output." >&2
            exit 1
          fi
          python3 tools/webos/check_release_eligibility.py \
            --version "$RELEASE_TAG" \
            --artifact "${ipks[0]}"

      - name: Prepare LG Seller Lounge handoff bundle
        if: ${{ needs.validate-trusted-ref.outputs.mode == 'release' && needs.validate-trusted-ref.outputs.include_webos_release == 'true' }}
        env:
          OUTPUT_DIR: ${{ steps.webos-build.outputs.output_dir }}
          RELEASE_TAG: ${{ needs.validate-trusted-ref.outputs.version }}
          SOURCE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ipks < <(find "$OUTPUT_DIR" -maxdepth 1 -type f -name '*.ipk' -print)
          if [[ "${#ipks[@]}" -ne 1 ]]; then
            echo "Expected exactly one WebOS IPK for the Seller Lounge bundle." >&2
            exit 1
          fi
          python3 scripts/tv_store_submission.py --store lg \
            --package "${ipks[0]}" --version "$RELEASE_TAG" \
            --source-commit "$SOURCE_COMMIT" --release-gates-passed \
            --evidence "$OUTPUT_DIR/webos-engine-provenance.json" \
            --evidence "$OUTPUT_DIR/webos-compatibility.json" \
            --evidence "$OUTPUT_DIR/SHA256SUMS.txt" \
            --output "$OUTPUT_DIR/PlezyNG-lg-webos-submission.zip"
      - name: Attest the WebOS package and provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            ${{ steps.webos-build.outputs.output_dir }}/*.ipk
            ${{ steps.webos-build.outputs.output_dir }}/webos-engine-provenance.json
            ${{ steps.webos-build.outputs.output_dir }}/webos-compatibility.json
            ${{ steps.webos-build.outputs.output_dir }}/SHA256SUMS.txt

      - name: Upload approved WebOS IPK for public release assembly
        if: ${{ needs.validate-trusted-ref.outputs.mode == 'release' && needs.validate-trusted-ref.outputs.include_webos_release == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: webos-ipk
          path: ${{ steps.webos-build.outputs.output_dir }}/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload WebOS validation evidence without vendor runtime binaries
        if: ${{ needs.validate-trusted-ref.outputs.mode == 'webos-validation' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: webos-validation-evidence
          path: |
            ${{ steps.webos-build.outputs.output_dir }}/webos-engine-provenance.json
            ${{ steps.webos-build.outputs.output_dir }}/webos-compatibility.json
            ${{ steps.webos-build.outputs.output_dir }}/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Preserve WebOS build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: webos-build-diagnostics
          path: ${{ runner.temp }}/plezyng-webos-${{ github.run_id }}/logs/**
          if-no-files-found: warn
          retention-days: 14

  build-tizen:
    if: ${{ inputs.runner_pool == 'private' && (inputs.action == 'build' || inputs.action == 'release') && needs.validate-trusted-ref.outputs.runner_pool == 'private' && (needs.validate-trusted-ref.outputs.action == 'build' || needs.validate-trusted-ref.outputs.action == 'release') && needs.validate-trusted-ref.outputs.mode == 'release' && needs.validate-trusted-ref.outputs.include_tizen_build == 'true' }}
    needs: validate-trusted-ref
    name: Build Samsung Tizen TV package (ARM)
    permissions:
      contents: read
    uses: ./.github/workflows/tizen.yml
    with:
      build_package: true
      architecture: arm
      tester_build: true
      security_profile: ''
      include_seller_office_handoff: false

  build-ios:
    if: ${{ inputs.runner_pool == 'private' && (inputs.action == 'build' || inputs.action == 'release') && needs.validate-trusted-ref.outputs.runner_pool == 'private' && (needs.validate-trusted-ref.outputs.action == 'build' || needs.validate-trusted-ref.outputs.action == 'release') && needs.validate-trusted-ref.outputs.mode == 'release' }}
    needs: validate-trusted-ref
    runs-on: ${{ fromJSON(format('{{"group":"private-apple-builds","labels":["self-hosted","macOS","ARM64","private-apple","ng-shared-main-plezyng","ng-main-run-{0}","gha-{0}-build-ios"]}}', github.run_id)) }}
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: "${{ env.TRUSTED_BUILD_CACHE_VERSION }}-flutter-:os:-:channel:-:version:-:arch:-:hash:"
          pub-cache: false

      - name: Cache Pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.pub-cache
          key: ${{ env.TRUSTED_BUILD_CACHE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-pub-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}

      - name: Cache CocoaPods
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: ${{ env.TRUSTED_BUILD_CACHE_VERSION }}-${{ runner.os }}-ios-pods-${{ hashFiles('**/Podfile.lock') }}

      - name: Ensure CMake for the embedded Steam receiver
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          command -v cmake >/dev/null || brew install cmake
          cmake --version

      - name: Install CocoaPods
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:$PATH"
          gem install cocoapods --version 1.17.0 --no-document \
            --install-dir "$RUNNER_TEMP/cocoapods-gems" \
            --bindir "$RUNNER_TEMP/cocoapods-bin"
          gem_path="$RUNNER_TEMP/cocoapods-gems:$(gem env gempath)"
          {
            echo "GEM_HOME=$RUNNER_TEMP/cocoapods-gems"
            echo "GEM_PATH=$gem_path"
          } >> "$GITHUB_ENV"
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/cocoapods-bin" >> "$GITHUB_PATH"
          export GEM_HOME="$RUNNER_TEMP/cocoapods-gems"
          export GEM_PATH="$gem_path"
          export PATH="$RUNNER_TEMP/cocoapods-bin:/opt/homebrew/bin:$PATH"
          pod --version

      - name: Prepare short iOS build workspace
        shell: bash
        run: |
          set -euo pipefail
          short_root="$HOME/p${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-ios"
          if [[ -e "$short_root" || -L "$short_root" ]]; then
            echo "Refusing to reuse existing Apple build path: $short_root" >&2
            exit 1
          fi
          mkdir -m 700 "$short_root"
          ditto "$GITHUB_WORKSPACE/." "$short_root/"
          chmod 700 "$short_root"
          [[ "$(git -C "$short_root" rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ ! -L "$short_root" && "$(cd "$short_root" && pwd -P)" == "$short_root" ]]
          if (( ${#short_root} > 64 )); then
            echo "Short iOS workspace path is unexpectedly long: $short_root" >&2
            exit 1
          fi
          echo "PLEZYNG_APPLE_WORKSPACE=$short_root" >> "$GITHUB_ENV"
          echo "Prepared real local build workspace: $short_root (${#short_root} characters)"

      - name: Install dependencies
        working-directory: ${{ env.PLEZYNG_APPLE_WORKSPACE }}
        run: flutter pub get --enforce-lockfile --no-example

      - name: Refresh pinned mpv Swift packages
        working-directory: ${{ env.PLEZYNG_APPLE_WORKSPACE }}
        run: scripts/refresh_apple_spm.sh ios

      - name: Configure optional iOS App Store signing
        id: ios-signing
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          values=("$APPLE_API_KEY_ID" "$APPLE_API_ISSUER_ID" "$APPLE_API_PRIVATE_KEY" "$APPLE_TEAM_ID")
          configured=0
          missing=0
          for value in "${values[@]}"; do
            if [[ -n "$value" ]]; then configured=$((configured + 1)); else missing=$((missing + 1)); fi
          done
          if (( configured == 0 )); then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Apple cloud signing is not configured; only the unsigned developer IPA will be attached."
            exit 0
          fi
          if (( missing != 0 )); then
            echo "Apple cloud-signing secrets are incomplete." >&2
            exit 1
          fi

          umask 077
          api_key_path="$RUNNER_TEMP/plezyng-ios-api-key.p8"
          export_options_path="$RUNNER_TEMP/plezyng-ios-export-options.plist"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$api_key_path"
          echo "api_key_path=$api_key_path" >> "$GITHUB_OUTPUT"
          echo "export_options_path=$export_options_path" >> "$GITHUB_OUTPUT"
          cat > "$export_options_path" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Build iOS (no codesign)
        working-directory: ${{ env.PLEZYNG_APPLE_WORKSPACE }}
        run: flutter build ios --release --no-codesign ${{ env.RELEASE_DART_DEFINES }} --split-debug-info=debug-info/ios

      - name: Create unsigned developer IPA
        working-directory: ${{ env.PLEZYNG_APPLE_WORKSPACE }}
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Plezy.app Payload/
          zip -r plezy-ios-unsigned.ipa Payload

      - name: Prepare a default keychain for Xcode cloud signing
        if: steps.ios-signing.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          keychain_path="$RUNNER_TEMP/plezyng-ios-cloud-signing.keychain-db"
          if [[ -e "$keychain_path" || -L "$keychain_path" ]]; then
            echo "Refusing to reuse an existing iOS signing keychain: $keychain_path" >&2
            exit 1
          fi
          keychain_password="$(/usr/bin/uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -d user -s "$keychain_path"

      - name: Build signed iOS App Store IPA
        if: steps.ios-signing.outputs.configured == 'true'
        env:
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_PATH: ${{ steps.ios-signing.outputs.api_key_path }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          EXPORT_OPTIONS_PATH: ${{ steps.ios-signing.outputs.export_options_path }}
        working-directory: ${{ env.PLEZYNG_APPLE_WORKSPACE }}
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign \
            ${{ env.RELEASE_DART_DEFINES }} \
            --dart-define=SUPPORTER_MODE=iap \
            --obfuscate \
            --split-debug-info=debug-info/ios-app-store

          archive_path="$RUNNER_TEMP/plezyng-ios-store.xcarchive"
          export_path="$RUNNER_TEMP/plezyng-ios-store-export"
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$archive_path" \
            -derivedDataPath "$RUNNER_TEMP/plezyng-ios-store-derived-data" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APPLE_API_KEY_PATH" \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            archive
          xcodebuild -exportArchive \
            -archivePath "$archive_path" \
            -exportPath "$export_path" \
            -exportOptionsPlist "$EXPORT_OPTIONS_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APPLE_API_KEY_PATH" \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER_ID"
          ipa_path=$(find "$export_path" -maxdepth 1 -type f -name '*.ipa' -print -quit)
          if [[ -z "$ipa_path" ]]; then
            echo "Xcode did not produce an iOS App Store IPA." >&2
            exit 1
          fi
          cp "$ipa_path" plezyng-ios-appstore.ipa

      - name: Remove the temporary iOS signing keychain
        if: always() && steps.ios-signing.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          keychain_path="$RUNNER_TEMP/plezyng-ios-cloud-signing.keychain-db"
          if [[ -e "$keychain_path" || -L "$keychain_path" ]]; then
            security delete-keychain "$keychain_path"
          fi

      - name: Copy iOS packages to the workflow workspace
        working-directory: ${{ env.PLEZYNG_APPLE_WORKSPACE }}
        run: |
          set -euo pipefail
          cp -f plezy-ios-unsigned.ipa "$GITHUB_WORKSPACE/"
          if [[ -f plezyng-ios-appstore.ipa ]]; then
            cp -f plezyng-ios-appstore.ipa "$GITHUB_WORKSPACE/"
          fi

      - name: Attest unsigned developer IPA
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: plezy-ios-unsigned.ipa

      - name: Attest signed iOS App Store IPA
        if: steps.ios-signing.outputs.configured == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: plezyng-ios-appstore.ipa

      - name: Remove iOS signing material
        if: always() && steps.ios-signing.outputs.api_key_path != ''
        env:
          APPLE_API_KEY_PATH: ${{ steps.ios-signing.outputs.api_key_path }}
          EXPORT_OPTIONS_PATH: ${{ steps.ios-signing.outputs.export_options_path }}
        run: |
          rm -f "$APPLE_API_KEY_PATH" "$EXPORT_OPTIONS_PATH"
          rm -rf "$RUNNER_TEMP/plezyng-ios-store.xcarchive" \
            "$RUNNER_TEMP/plezyng-ios-store-export" \
            "$RUNNER_TEMP/plezyng-ios-store-derived-data"

      - name: Upload IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ios-ipa
          path: |
            plezy-ios-unsigned.ipa
            plezyng-ios-appstore.ipa
          if-no-files-found: error

      - name: Remove short iOS build workspace
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          short_root="$HOME/p${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-ios"
          if [[ -d "$short_root" && ! -L "$short_root" && "$(cd "$short_root" && pwd -P)" == "$short_root" ]]; then
            if [[ -d "$short_root/ios/Pods" ]]; then
              mkdir -p "$GITHUB_WORKSPACE/ios"
              ditto "$short_root/ios/Pods" "$GITHUB_WORKSPACE/ios/Pods"
            fi
            rm -rf -- "$short_root"
          elif [[ -e "$short_root" || -L "$short_root" ]]; then
            echo "Refusing to remove unexpected Apple build path: $short_root" >&2
            exit 1
          fi

  build-tvos:
    if: ${{ inputs.runner_pool == 'private' && (inputs.action == 'build' || inputs.action == 'release') && needs.validate-trusted-ref.outputs.runner_pool == 'private' && (needs.validate-trusted-ref.outputs.action == 'build' || needs.validate-trusted-ref.outputs.action == 'release') && needs.validate-trusted-ref.outputs.mode == 'release' }}
