name: Plezy Labs

on:
  workflow_dispatch:
    inputs:
      official_tag:
        description: Published official tag to use (blank selects the latest stable release)
        required: false
        type: string
      publish:
        description: Publish automatically instead of creating an editable draft
        default: false
        type: boolean
  release:
    types: [published]

permissions:
  actions: write
  contents: write
  issues: write

env:
  SENTRY_DART_DEFINE: ${{ github.repository == 'edde746/plezy' && '--dart-define=ENABLE_SENTRY=true' || '' }}
  SENTRY_ENV_DART_DEFINE: --dart-define=SENTRY_ENVIRONMENT=github
  DONATIONS_DART_DEFINE: --dart-define=ENABLE_DONATIONS=true
  LINUX_APT_PACKAGES: >
    clang cmake meson ninja-build pkg-config nasm libgtk-3-dev libevdev-dev liblzma-dev
    libstdc++-12-dev libasound2-dev libass-dev libfreetype-dev libfontconfig-dev libfribidi-dev
    libharfbuzz-dev libepoxy-dev libegl-dev libgl-dev libgnutls28-dev libpipewire-0.3-dev
    libva-dev libvdpau-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev
    libxss-dev libxpresent-dev libxkbcommon-dev libpulse-dev libdbus-1-dev libdrm-dev
    libdisplay-info-dev libgbm-dev libwayland-dev wayland-protocols liblcms2-dev libmujs-dev liblua5.2-dev
    ruby ruby-dev rubygems build-essential rpm libarchive-tools imagemagick libcurl4-openssl-dev

concurrency:
  group: plezy-labs
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      official_tag: ${{ steps.metadata.outputs.official_tag }}
      flutter_version: ${{ steps.metadata.outputs.flutter_version }}
      version: ${{ steps.metadata.outputs.version }}
      revision: ${{ steps.metadata.outputs.revision }}
      build_number: ${{ steps.metadata.outputs.build_number }}
      tag: ${{ steps.metadata.outputs.tag }}
      source_sha: ${{ steps.rebuild.outputs.source_sha }}
      applied_features: ${{ steps.rebuild.outputs.applied_features }}
      failure_stage: ${{ steps.result.outputs.failure_stage }}
      failure_details: ${{ steps.result.outputs.failure_details }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: labs
          fetch-depth: 0

      - name: Resolve official release and Labs metadata
        id: metadata
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_TAG: ${{ inputs.official_tag }}
        run: |
          set -euo pipefail
          TAG="$REQUESTED_TAG"
          if [[ -z "$TAG" ]]; then
            TAG=$(gh api repos/edde746/plezy/releases/latest --jq '.tag_name')
          fi
          [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Official tag must be numeric X.Y.Z: $TAG" >&2
            exit 1
          }

          RELEASE=$(gh api "repos/edde746/plezy/releases/tags/$TAG")
          test "$(jq -r '.draft' <<<"$RELEASE")" = false
          test "$(jq -r '.prerelease' <<<"$RELEASE")" = false

          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream https://github.com/edde746/plezy.git
          else
            git remote add upstream https://github.com/edde746/plezy.git
          fi
          git fetch upstream main --tags --prune
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --tags --prune
          git merge-base --is-ancestor "$TAG" upstream/main

          SOURCE_VERSION=$(git show "$TAG:pubspec.yaml" | sed -n 's/^version: \([^+]*\).*/\1/p')
          test "$TAG" = "$SOURCE_VERSION" || {
            echo "Published tag $TAG does not match pubspec version $SOURCE_VERSION" >&2
            exit 1
          }

          FLUTTER_VERSION=$(git show "$TAG:.github/workflows/build.yml" | python3 scripts/resolve_labs_flutter_version.py)
          [[ "$FLUTTER_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Official Flutter pin is not numeric X.Y.Z: $FLUTTER_VERSION" >&2
            exit 1
          }

          MAX_REVISION=0
          while IFS= read -r existing; do
            if [[ "$existing" =~ -r([0-9]+)$ ]]; then
              value=${BASH_REMATCH[1]}
              (( value > MAX_REVISION )) && MAX_REVISION=$value
            fi
          done < <(git tag --list "labs-v$TAG-r*")
          REVISION=$((MAX_REVISION + 1))

          TAG_COUNT=0
          MAX_BUILD=9999
          while IFS= read -r existing; do
            [[ -z "$existing" ]] && continue
            TAG_COUNT=$((TAG_COUNT + 1))
            message=$(git for-each-ref --format='%(contents)' "refs/tags/$existing")
            build=$(sed -n 's/.*build \([0-9][0-9]*\).*/\1/p' <<<"$message" | head -1)
            if [[ -n "$build" && "$build" -gt "$MAX_BUILD" ]]; then
              MAX_BUILD=$build
            fi
          done < <(git tag --list 'labs-v*-r*')
          BUILD_NUMBER=$((MAX_BUILD + 1))
          COUNT_BUILD=$((10000 + TAG_COUNT))
          (( COUNT_BUILD > BUILD_NUMBER )) && BUILD_NUMBER=$COUNT_BUILD
          (( BUILD_NUMBER <= 65535 )) || {
            echo "Plezy Labs exhausted the Windows-compatible build-number range." >&2
            exit 1
          }

          LABS_TAG="labs-v$TAG-r$REVISION"
          REMOTE_LABS_SHA=$(git rev-parse refs/remotes/origin/labs)
          {
            echo "official_tag=$TAG"
            echo "flutter_version=$FLUTTER_VERSION"
            echo "version=$TAG"
            echo "revision=$REVISION"
            echo "build_number=$BUILD_NUMBER"
            echo "tag=$LABS_TAG"
            echo "remote_labs_sha=$REMOTE_LABS_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Setup upstream-pinned Flutter
        id: flutter
        if: steps.metadata.outcome == 'success'
        continue-on-error: true
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: ${{ steps.metadata.outputs.flutter_version }}
          cache: true
          pub-cache: false

      - name: Check Labs preference compatibility
        id: preferences
        if: steps.metadata.outcome == 'success' && steps.flutter.outcome == 'success'
        continue-on-error: true
        run: scripts/check-labs-preferences.sh "${{ steps.metadata.outputs.official_tag }}"

      - name: Reconstruct Labs candidate
        id: rebuild
        if: steps.metadata.outcome == 'success' && steps.preferences.outcome == 'success'
        continue-on-error: true
        run: |
          scripts/rebuild-labs.py \
            --official-tag "${{ steps.metadata.outputs.official_tag }}" \
            --manifest tool/labs_features.json \
            --report "$RUNNER_TEMP/labs-rebuild-report.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Run repository checks
        id: checks
        if: steps.rebuild.outcome == 'success'
        continue-on-error: true
        run: |
          (cd packages/saf_util && flutter pub get)
          (cd packages/wakelock_plus && flutter pub get --enforce-lockfile --no-example)
          scripts/prepare-labs-translations.py --check
          python3 scripts/test_prepare_labs_translations.py
          python3 scripts/test_rebuild_labs.py
          python3 scripts/test_resolve_labs_flutter_version.py
          python3 scripts/check-labs-workflows.py
          scripts/check-labs-candidate.sh "${{ steps.metadata.outputs.official_tag }}"

      - name: Keep upstream publishing workflows disabled
        id: disable
        if: steps.checks.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for workflow in release.yml update-packages.yml; do
            state=$(gh api \
              "repos/${{ github.repository }}/actions/workflows/$workflow" \
              --jq '.state')
            if [[ "$state" == active ]]; then
              gh workflow disable "$workflow" --repo "${{ github.repository }}"
            elif [[ "$state" == disabled_* ]]; then
              echo "$workflow is already $state"
            else
              echo "$workflow has unexpected state: $state" >&2
              exit 1
            fi
          done

      - name: Push verified Labs candidate
        id: push
        if: steps.checks.outcome == 'success' && steps.disable.outcome == 'success'
        continue-on-error: true
        run: |
          git push \
            --force-with-lease="refs/heads/labs:${{ steps.metadata.outputs.remote_labs_sha }}" \
            origin HEAD:labs

      - name: Summarize preparation result
        id: result
        if: always()
        env:
          REPORT: ${{ runner.temp }}/labs-rebuild-report.json
        run: |
          stage=""
          details=""
          if [[ "${{ steps.metadata.outcome }}" != "success" ]]; then
            stage="metadata"
            details="Could not resolve or validate the official release and Labs revision."
          elif [[ "${{ steps.flutter.outcome }}" != "success" ]]; then
            stage="toolchain"
            details="Could not install the Flutter version pinned by the official release."
          elif [[ "${{ steps.preferences.outcome }}" != "success" ]]; then
            stage="preferences"
            details="An official preference collides with a Labs-owned preference without a registered migration."
          elif [[ "${{ steps.rebuild.outcome }}" != "success" ]]; then
            stage=$(jq -r '.stage // "reconstruction"' "$REPORT" 2>/dev/null || echo reconstruction)
            details=$(jq -r '[.message, (if (.feature // "") != "" then "Feature: " + .feature else empty end), (if (.files // [] | length) > 0 then "Files: " + (.files | join(", ")) else empty end)] | map(select(. != null)) | join("\n")' "$REPORT" 2>/dev/null || echo "Labs reconstruction failed.")
          elif [[ "${{ steps.checks.outcome }}" != "success" ]]; then
            stage="checks"
            details="The reconstructed candidate failed repository validation."
          elif [[ "${{ steps.disable.outcome }}" != "success" ]]; then
            stage="workflow-safety"
            details="Could not disable the upstream publishing workflows on the fork."
          elif [[ "${{ steps.push.outcome }}" != "success" ]]; then
            stage="push"
            details="The verified candidate could not replace labs using force-with-lease."
          fi
          echo "failure_stage=$stage" >> "$GITHUB_OUTPUT"
          {
            echo 'failure_details<<EOF'
            echo "$details"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Fail blocked preparation
        if: steps.result.outputs.failure_stage != ''
        run: |
          echo "${{ steps.result.outputs.failure_details }}" >&2
          exit 1

  build-macos:
    needs: prepare
    if: needs.prepare.result == 'success'
    env:
      GIT_COMMIT_DART_DEFINE: --dart-define=GIT_COMMIT=${{ needs.prepare.outputs.source_sha }}
      LABS_DART_DEFINES: --dart-define=PLEZY_LABS=true --dart-define=LABS_REVISION=${{ needs.prepare.outputs.revision }}
    runs-on: macos-26
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Configure Plezy Labs updater key
        env:
          LABS_UPDATE_PUBLIC_KEY: ${{ vars.LABS_UPDATE_PUBLIC_KEY }}
        run: |
          test -n "$LABS_UPDATE_PUBLIC_KEY" || { echo "LABS_UPDATE_PUBLIC_KEY is required"; exit 1; }
          /usr/libexec/PlistBuddy -c "Set :SUPublicEDKey $LABS_UPDATE_PUBLIC_KEY" macos/Runner/Info.plist

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: "stable"
          flutter-version: ${{ needs.prepare.outputs.flutter_version }}
          cache: true
          pub-cache: false

      - name: Cache Pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-${{ runner.arch }}-pub-v2-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}

      - name: Cache CocoaPods
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            macos/Pods
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: ${{ runner.os }}-macos-pods-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-macos-pods-

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile --no-example

      - name: Build macOS
        run: flutter build macos --release --build-name=${{ needs.prepare.outputs.version }} --build-number=${{ needs.prepare.outputs.build_number }} --dart-define=ENABLE_UPDATE_CHECK=true ${{ env.LABS_DART_DEFINES }} ${{ env.SENTRY_DART_DEFINE }} ${{ env.GIT_COMMIT_DART_DEFINE }} ${{ env.SENTRY_ENV_DART_DEFINE }} --dart-define=SENTRY_DIST=github-macos ${{ env.DONATIONS_DART_DEFINE }} --split-debug-info=debug-info/macos

      - name: Upload symbols to bugs.plezy.app
        if: github.repository == 'edde746/plezy'
        env:
          BUGS_ADMIN_TOKEN: ${{ secrets.BUGS_ADMIN_TOKEN }}
          SENTRY_DIST: github-macos
        run: ./scripts/upload-symbols.sh macos

      - name: Import Code Signing Certificate
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate to keychain
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          echo "$MACOS_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          security import $CERTIFICATE_PATH -k $KEYCHAIN_PATH -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Add keychain to search list
          security list-keychains -d user -s $KEYCHAIN_PATH login.keychain

      - name: Sign Application
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Find the identity
          IDENTITY=$(security find-identity -v -p codesigning | grep "Developer ID Application" | head -1 | grep -o '".*"' | tr -d '"')
          echo "Signing with identity: $IDENTITY"

          APP_PATH="build/macos/Build/Products/Release/Plezy.app"

          # Deep sign everything inside-out: executables, dylibs, XPC services, app bundles, frameworks
          find "$APP_PATH/Contents/Frameworks" \( -name "*.xpc" -o -name "*.app" -o -name "*.framework" -o -name "*.dylib" \) -print0 \
            | sort -zr \
            | while IFS= read -r -d '' item; do
              echo "Signing: $item"
              codesign --force --sign "$IDENTITY" --timestamp --options runtime "$item"
            done

          # Sign any remaining bare executables (e.g. Sparkle's Autoupdate)
          find "$APP_PATH/Contents/Frameworks" -type f -perm +111 ! -name "*.dylib" ! -path "*/Headers/*" ! -path "*/Modules/*" -print0 \
            | while IFS= read -r -d '' exe; do
              codesign --force --sign "$IDENTITY" --timestamp --options runtime "$exe" 2>/dev/null || true
            done

          # Sign the app bundle itself
          echo "Signing app bundle: $APP_PATH"
          codesign --force --sign "$IDENTITY" --timestamp --options runtime --entitlements macos/Runner/Release.entitlements "$APP_PATH"

      - name: Verify Signature
        run: |
          APP_PATH="build/macos/Build/Products/Release/Plezy.app"
          echo "Verifying signature..."
          codesign -dvvv "$APP_PATH"
          echo "Verifying signed entitlements..."
          codesign -d --entitlements :- "$APP_PATH" > "$RUNNER_TEMP/macos-entitlements.plist"
          /usr/libexec/PlistBuddy -c "Print" "$RUNNER_TEMP/macos-entitlements.plist"
          /usr/libexec/PlistBuddy -c "Print :com.apple.security.cs.allow-jit" "$RUNNER_TEMP/macos-entitlements.plist"
          /usr/libexec/PlistBuddy -c "Print :com.apple.security.cs.allow-unsigned-executable-memory" "$RUNNER_TEMP/macos-entitlements.plist"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Notarize Application
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP_PATH="build/macos/Build/Products/Release/Plezy.app"

          # Create a temporary ZIP for notarization submission
          echo "Creating ZIP for notarization..."
          ditto -c -k --keepParent "$APP_PATH" notarization.zip

          # Submit for notarization
          echo "Submitting to Apple's notary service..."
          xcrun notarytool submit notarization.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          # Staple the notarization ticket to the app
          echo "Stapling notarization ticket..."
          xcrun stapler staple "$APP_PATH"

          # Verify stapling
          echo "Verifying notarization..."
          xcrun stapler validate "$APP_PATH"

      - name: Create DMG
        run: |
          mkdir -p dmg-staging
          cp -R build/macos/Build/Products/Release/Plezy.app dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -format ULMO -srcfolder dmg-staging -volname "Plezy" plezy-macos.dmg

      - name: Sign DMG for Sparkle (EdDSA)
        env:
          LABS_SPARKLE_PRIVATE_KEY: ${{ secrets.LABS_SPARKLE_PRIVATE_KEY }}
        run: |
          test -n "$LABS_SPARKLE_PRIVATE_KEY" || { echo "LABS_SPARKLE_PRIVATE_KEY is required"; exit 1; }
          printf '%s' "$LABS_SPARKLE_PRIVATE_KEY" > ed25519_key.pem
          OUTPUT=$(dart run auto_updater:sign_update plezy-macos.dmg ed25519_key.pem)
          rm ed25519_key.pem
          # Extract edSignature value from output like: sparkle:edSignature="..." length="..."
          SIGNATURE=$(echo "$OUTPUT" | grep -o 'edSignature="[^"]*"' | sed 's/edSignature="//;s/"//')
          echo "MACOS_ED_SIGNATURE=$SIGNATURE" >> $GITHUB_ENV
          echo "MACOS_DMG_SIZE=$(stat -f%z plezy-macos.dmg)" >> $GITHUB_ENV

      - name: Attest macOS DMG
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: plezy-macos.dmg

      - name: Write macOS signature metadata
        run: |
          echo "${{ env.MACOS_ED_SIGNATURE }}" > macos-ed-signature.txt
          echo "${{ env.MACOS_DMG_SIZE }}" > macos-dmg-size.txt

      - name: Upload macOS DMG
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: macos-dmg
          path: |
            plezy-macos.dmg
            macos-ed-signature.txt
            macos-dmg-size.txt

  build-windows:
    needs: prepare
    if: needs.prepare.result == 'success'
    env:
      GIT_COMMIT_DART_DEFINE: --dart-define=GIT_COMMIT=${{ needs.prepare.outputs.source_sha }}
      LABS_DART_DEFINES: --dart-define=PLEZY_LABS=true --dart-define=LABS_REVISION=${{ needs.prepare.outputs.revision }}
    name: Build Windows (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            flutter_setup: action
            native_cache_path: build/windows/x64/_deps
          - arch: arm64
            runner: windows-11-arm
            flutter_setup: git
            native_cache_path: |
              build/windows/arm64/_deps
              build/windows/arm64/mpv-dev-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Configure Plezy Labs updater key
        shell: pwsh
        env:
          LABS_UPDATE_PUBLIC_KEY: ${{ vars.LABS_UPDATE_PUBLIC_KEY }}
        run: |
          if (-not $env:LABS_UPDATE_PUBLIC_KEY) { throw "LABS_UPDATE_PUBLIC_KEY is required" }
          (Get-Content windows/runner/Runner.rc -Raw).Replace('PLEZY_LABS_UPDATE_PUBLIC_KEY', $env:LABS_UPDATE_PUBLIC_KEY) | Set-Content windows/runner/Runner.rc -NoNewline

      - name: Cache Windows native dependencies
        id: windows-native-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ matrix.native_cache_path }}
          key: windows-native-${{ matrix.arch }}-${{ hashFiles('windows/CMakeLists.txt') }}

      - name: Install 7-Zip
        if: matrix.arch == 'arm64' && steps.windows-native-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: choco install 7zip -y

      - name: Setup Flutter
        if: matrix.flutter_setup == 'action'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: "stable"
          flutter-version: ${{ needs.prepare.outputs.flutter_version }}
          cache: true
          pub-cache: false

      - name: Set up upstream-pinned Flutter (git tag)
        if: matrix.flutter_setup == 'git'
        # Flutter publishes no windows-arm64 SDK archive, so subosito can't
        # resolve the upstream pin for arm64: the stable manifest has no arm64 entry, and
        # `channel: master` would git-clone master HEAD (whose engine != our
        # patched upstream SDK). Clone the official tag's Flutter pin directly;
        # install-patched-engine.ps1 asserts its engine revision before swapping.
        shell: pwsh
        run: |
          $root = "$env:RUNNER_TEMP\flutter"
          $version = "${{ needs.prepare.outputs.flutter_version }}"
          git clone --depth 1 --branch $version https://github.com/flutter/flutter.git $root
          "$root\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & "$root\bin\flutter.bat" --version

      - name: Cache Pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~\AppData\Local\Pub\Cache
          key: ${{ runner.os }}-${{ runner.arch }}-pub-v2-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}

      - name: Install dependencies
        shell: pwsh
        run: flutter pub get --enforce-lockfile --no-example

      - name: Install patched Flutter engine (DComp)
        shell: pwsh
        run: |
          flutter precache --windows
          .\windows\tool\install-patched-engine.ps1

      - name: Build Windows ${{ matrix.arch }}
        shell: pwsh
        run: flutter build windows --release --build-name=${{ needs.prepare.outputs.version }} --build-number=${{ needs.prepare.outputs.build_number }} --dart-define=ENABLE_UPDATE_CHECK=true ${{ env.LABS_DART_DEFINES }} ${{ env.SENTRY_DART_DEFINE }} ${{ env.GIT_COMMIT_DART_DEFINE }} ${{ env.SENTRY_ENV_DART_DEFINE }} --dart-define=SENTRY_DIST=github-windows-${{ matrix.arch }} ${{ env.DONATIONS_DART_DEFINE }} --split-debug-info=debug-info/windows-${{ matrix.arch }}

      - name: Upload symbols to bugs.plezy.app
        if: github.repository == 'edde746/plezy'
        shell: pwsh
        env:
          BUGS_ADMIN_TOKEN: ${{ secrets.BUGS_ADMIN_TOKEN }}
          SENTRY_DIST: github-windows-${{ matrix.arch }}
        run: .\scripts\upload-symbols.ps1 windows-${{ matrix.arch }}

      - name: Upload ${{ matrix.arch }} build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-${{ matrix.arch }}-build
          path: build/windows/${{ matrix.arch }}/runner/Release/

  package-windows:
    needs: [prepare, build-windows]
    if: needs.build-windows.result == 'success'
    runs-on: windows-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Setup Dart
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260

      - name: Download x64 build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: windows-x64-build
          path: build-x64

      - name: Download arm64 build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: windows-arm64-build
          path: build-arm64

      - name: Read version from pubspec
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)').Matches[0].Groups[1].Value -replace '\+.*'
          echo "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build installer and portables
        run: .\windows\build-installer.ps1 -X64BuildDir "build-x64" -Arm64BuildDir "build-arm64" -Version "${{ steps.version.outputs.version }}"

      - name: Sign installer for WinSparkle (EdDSA)
        env:
          LABS_SPARKLE_PRIVATE_KEY: ${{ secrets.LABS_SPARKLE_PRIVATE_KEY }}
        shell: pwsh
        run: |
          if (-not $env:LABS_SPARKLE_PRIVATE_KEY) { throw "LABS_SPARKLE_PRIVATE_KEY is required" }
          mkdir _signer | Out-Null
          @{name="signer"; environment=@{sdk=">=3.0.0 <4.0.0"}; dependencies=@{cryptography="^2.7.0"}} | ConvertTo-Json -Depth 3 | Out-File _signer/pubspec.yaml
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/edde746/auto_updater/9e150f71e17495b7361aedbe6df22e89ad52c254/packages/auto_updater/bin/sign_update.dart" -OutFile _signer/sign.dart
          Push-Location _signer
          dart pub get
          Set-Content -Path ed25519_key.pem -Value $env:LABS_SPARKLE_PRIVATE_KEY -Encoding ascii -NoNewline
          $output = dart run sign.dart ../plezy-windows-installer.exe ed25519_key.pem
          Pop-Location
          Remove-Item _signer -Recurse -Force
          $sig = [regex]::Match($output, 'edSignature="([^"]*)"').Groups[1].Value
          Set-Content -Path win-ed-signature.txt -Value $sig -Encoding ascii -NoNewline
          Set-Content -Path win-installer-size.txt -Value (Get-Item plezy-windows-installer.exe).Length.ToString() -Encoding ascii -NoNewline

      - name: Attest Windows artifacts
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: |
            plezy-windows-x64-portable.7z
            plezy-windows-arm64-portable.7z
            plezy-windows-installer.exe

      - name: Upload x64 portable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-x64-portable
          path: plezy-windows-x64-portable.7z

      - name: Upload arm64 portable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-arm64-portable
          path: plezy-windows-arm64-portable.7z

      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-installer
          path: |
            plezy-windows-installer.exe
            win-ed-signature.txt
            win-installer-size.txt

  build-linux:
    needs: prepare
    if: needs.prepare.result == 'success'
    env:
      GIT_COMMIT_DART_DEFINE: --dart-define=GIT_COMMIT=${{ needs.prepare.outputs.source_sha }}
      LABS_DART_DEFINES: --dart-define=PLEZY_LABS=true --dart-define=LABS_REVISION=${{ needs.prepare.outputs.revision }}
    name: Build Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      id-token: write
      attestations: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
            flutter_channel: stable
            pkg_config_arch: x86_64-linux-gnu
          - arch: arm64
            runner: ubuntu-24.04-arm
            flutter_channel: master
            pkg_config_arch: aarch64-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: ${{ matrix.flutter_channel }}
          flutter-version: ${{ needs.prepare.outputs.flutter_version }}
          cache: true
          pub-cache: false

      - name: Cache Pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-${{ runner.arch }}-pub-v2-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}

      - name: Cache APT packages
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9
        with:
          packages: ${{ env.LINUX_APT_PACKAGES }}
          version: 1.1

      - name: Install Linux dependencies
        shell: bash
        run: |
          read -r -a packages <<< "$LINUX_APT_PACKAGES"

          for attempt in 1 2 3; do
            if sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install -y -o Acquire::Retries=3 "${packages[@]}"; then
              exit 0
            fi

            sudo apt-get clean
            sudo rm -rf /var/lib/apt/lists/*
            sleep $((attempt * 15))
          done

          exit 1

      - name: Cache libmpv build
        id: libmpv-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: libmpv-prefix
          key: libmpv-${{ runner.arch }}-${{ hashFiles('linux/packaging/build-libmpv.sh', 'linux/packaging/native-inputs.json') }}

      - name: Build libmpv
        if: steps.libmpv-cache.outputs.cache-hit != 'true'
        shell: bash
        run: bash linux/packaging/build-libmpv.sh

      - name: Install fpm
        shell: bash
        run: sudo gem install fpm --version 1.17.0 --no-document

      - name: Install dependencies
        shell: bash
        run: flutter pub get --enforce-lockfile --no-example

      - name: Build Linux ${{ matrix.arch }}
        shell: bash
        run: flutter build linux --release --build-name=${{ needs.prepare.outputs.version }} --build-number=${{ needs.prepare.outputs.build_number }} --dart-define=ENABLE_UPDATE_CHECK=true ${{ env.LABS_DART_DEFINES }} ${{ env.SENTRY_DART_DEFINE }} ${{ env.GIT_COMMIT_DART_DEFINE }} ${{ env.SENTRY_ENV_DART_DEFINE }} --dart-define=SENTRY_DIST=github-linux-${{ matrix.arch }} ${{ env.DONATIONS_DART_DEFINE }} --split-debug-info=debug-info/linux-${{ matrix.arch }}
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/libmpv-prefix/lib/pkgconfig:${{ github.workspace }}/libmpv-prefix/lib/${{ matrix.pkg_config_arch }}/pkgconfig

      - name: Upload symbols to bugs.plezy.app
        if: github.repository == 'edde746/plezy'
        shell: bash
        env:
          BUGS_ADMIN_TOKEN: ${{ secrets.BUGS_ADMIN_TOKEN }}
          SENTRY_DIST: github-linux-${{ matrix.arch }}
        run: ./scripts/upload-symbols.sh linux-${{ matrix.arch }}

      - name: Resolve bundle directory
        shell: bash
        run: |
          if [[ "${{ matrix.arch }}" == "x64" ]]; then
            bundle_dir=build/linux/x64/release/bundle
          else
            bundle_dir=$(find build/linux -path "*/release/bundle" -type d | head -1)
          fi
          if [[ -z "$bundle_dir" || ! -d "$bundle_dir" ]]; then
            echo "ERROR: Linux bundle directory not found" >&2
            exit 1
          fi
          echo "BUNDLE_DIR=$bundle_dir" >> "$GITHUB_ENV"

      - name: Copy libmpv into bundle
        shell: bash
        run: |
          BUNDLE_LIB="$BUNDLE_DIR/lib"
          LIBMPV_DIR=$(dirname "$(find libmpv-prefix -name 'libmpv.so' | head -1)")
          cp -a "$LIBMPV_DIR"/libmpv.so* "$BUNDLE_LIB/"
          cp -a libmpv-prefix/lib/libshaderc_shared.so* "$BUNDLE_LIB/"

      - name: Bundle shared libraries
        shell: bash
        run: bash linux/packaging/bundle-libs.sh "$BUNDLE_DIR"

      - name: Copy wrapper script into bundle
        shell: bash
        run: cp linux/packaging/plezy.sh "$BUNDLE_DIR/plezy.sh"

      - name: Verify every unbundled library the bundle needs is declared
        shell: bash
        run: python3 linux/packaging/check-bundle-host-deps.py "$BUNDLE_DIR"

      - name: Build Linux Packages
        shell: bash
        run: |
          BUILD_DIR="$BUNDLE_DIR" \
          ARCH_SUFFIX=${{ matrix.arch }} \
          OUTPUT_DIR="$GITHUB_WORKSPACE" \
          LABS_VERSION=${{ needs.prepare.outputs.version }} \
          LABS_PACKAGE_ITERATION=labs.${{ needs.prepare.outputs.revision }} \
          LABS_PACKAGE_BUILD=${{ needs.prepare.outputs.build_number }} \
          PLEZY_SKIP_HOST_DEP_CHECK=1 \
          python3 linux/packaging/build-packages.py

      - name: Verify the declared dependencies reached the package metadata
        shell: bash
        run: python3 linux/packaging/check-package-deps.py "$GITHUB_WORKSPACE" --arch ${{ matrix.arch }}

      - name: Create tarball
        shell: bash
        run: |
          cd "$BUNDLE_DIR"
          tar -czf "$GITHUB_WORKSPACE/plezy-linux-${{ matrix.arch }}.tar.gz" *

      - name: Attest Linux ${{ matrix.arch }} artifacts
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: |
            plezy-linux-${{ matrix.arch }}.tar.gz
            plezy-linux-${{ matrix.arch }}.deb
            plezy-linux-${{ matrix.arch }}.rpm
            plezy-linux-${{ matrix.arch }}.pkg.tar.zst

      - name: Upload Linux ${{ matrix.arch }} artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: linux-${{ matrix.arch }}
          path: |
            plezy-linux-${{ matrix.arch }}.tar.gz
            plezy-linux-${{ matrix.arch }}.deb
            plezy-linux-${{ matrix.arch }}.rpm
            plezy-linux-${{ matrix.arch }}.pkg.tar.zst

  create-release:
    needs: [prepare, build-macos, build-windows, package-windows, build-linux]
    if: ${{ always() && needs.prepare.result == 'success' && needs.build-macos.result == 'success' && needs.build-windows.result == 'success' && needs.package-windows.result == 'success' && needs.build-linux.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0

      - name: Download macOS artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: macos-dmg
          path: artifacts/macos-dmg

      - name: Download Windows x64 artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: windows-x64-portable
          path: artifacts/windows-x64-portable

      - name: Download Windows arm64 artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: windows-arm64-portable
          path: artifacts/windows-arm64-portable

      - name: Download Windows installer artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: windows-installer
          path: artifacts/windows-installer

      - name: Download Linux x64 artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: linux-x64
          path: artifacts/linux-x64

      - name: Download Linux arm64 artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: linux-arm64
          path: artifacts/linux-arm64

      - name: Validate release metadata and signatures
        run: |
          SOURCE_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//')
          test "${{ needs.prepare.outputs.version }}" = "$SOURCE_VERSION"
          test "${{ needs.prepare.outputs.build_number }}" -ge 10000
          test "${{ needs.prepare.outputs.build_number }}" -le 65535
          test -s artifacts/macos-dmg/macos-ed-signature.txt
          grep -q '[^[:space:]]' artifacts/macos-dmg/macos-ed-signature.txt
          test -s artifacts/windows-installer/win-ed-signature.txt
          grep -q '[^[:space:]]' artifacts/windows-installer/win-ed-signature.txt

      - name: Generate appcast.xml
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          BUILD_NUMBER="${{ needs.prepare.outputs.build_number }}"
          MACOS_ED_SIG=$(cat artifacts/macos-dmg/macos-ed-signature.txt)
          MACOS_DMG_SIZE=$(cat artifacts/macos-dmg/macos-dmg-size.txt)
          WIN_ED_SIG=$(cat artifacts/windows-installer/win-ed-signature.txt)
          WIN_INSTALLER_SIZE=$(cat artifacts/windows-installer/win-installer-size.txt)

          cat > appcast.xml << XMLEOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Plezy Labs Updates</title>
              <item>
                <title>Plezy Labs ${VERSION} r${{ needs.prepare.outputs.revision }}</title>
                <sparkle:version>${BUILD_NUMBER}</sparkle:version>
                <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
                <sparkle:releaseNotesLink>https://github.com/${{ github.repository }}/releases/tag/${{ needs.prepare.outputs.tag }}</sparkle:releaseNotesLink>
                <enclosure url="https://github.com/${{ github.repository }}/releases/download/${{ needs.prepare.outputs.tag }}/plezy-macos.dmg"
                           length="${MACOS_DMG_SIZE}" type="application/octet-stream"
                           sparkle:edSignature="${MACOS_ED_SIG}"
                           sparkle:os="macos" />
                <enclosure url="https://github.com/${{ github.repository }}/releases/download/${{ needs.prepare.outputs.tag }}/plezy-windows-installer.exe"
                           length="${WIN_INSTALLER_SIZE}" type="application/octet-stream"
                           sparkle:edSignature="${WIN_ED_SIG}"
                           sparkle:installerArguments="/SILENT /SP-"
                           sparkle:os="windows" />
              </item>
            </channel>
          </rss>
          XMLEOF
          sed -i 's/^          //' appcast.xml

      - name: Generate GitHub release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLIED_FEATURES: ${{ needs.prepare.outputs.applied_features }}
        run: |
          gh api \
            "repos/edde746/plezy/releases/tags/${{ needs.prepare.outputs.official_tag }}" \
            --jq '.body // ""' > official-release-notes.md
          scripts/generate-labs-release-notes.py \
            --manifest tool/labs_features.json \
            --applied-features "$APPLIED_FEATURES" \
            --official-tag "${{ needs.prepare.outputs.official_tag }}" \
            --official-notes official-release-notes.md \
            --output release-notes.md

      - name: Create immutable Labs tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ needs.prepare.outputs.tag }}" "${{ needs.prepare.outputs.source_sha }}" \
            -m "Plezy Labs ${{ needs.prepare.outputs.version }} r${{ needs.prepare.outputs.revision }} (build ${{ needs.prepare.outputs.build_number }})"
          git push origin "${{ needs.prepare.outputs.tag }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.source_sha }}
          name: Plezy Labs ${{ needs.prepare.outputs.version }} r${{ needs.prepare.outputs.revision }}
          files: |
            artifacts/macos-dmg/plezy-macos.dmg
            artifacts/windows-x64-portable/plezy-windows-x64-portable.7z
            artifacts/windows-arm64-portable/plezy-windows-arm64-portable.7z
            artifacts/windows-installer/plezy-windows-installer.exe
            artifacts/linux-x64/*
            artifacts/linux-arm64/*
            appcast.xml
          draft: ${{ !inputs.publish }}
          prerelease: false
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish native updater feed
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/publish-labs-feed.sh "${{ needs.prepare.outputs.tag }}"

      - name: Close resolved automation issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/manage-labs-issue.sh success "${{ needs.prepare.outputs.tag }}"

  report-failure:
    needs: [prepare, build-macos, build-windows, package-windows, build-linux, create-release]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: labs

      - name: Open or update automation issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          PREPARE_STAGE: ${{ needs.prepare.outputs.failure_stage }}
          PREPARE_DETAILS: ${{ needs.prepare.outputs.failure_details }}
          LABS_TAG: ${{ needs.prepare.outputs.tag || inputs.official_tag || 'latest-official' }}
        run: |
          stage="$PREPARE_STAGE"
          details="$PREPARE_DETAILS"
          if [[ -z "$stage" ]]; then
            stage=$(jq -r '[to_entries[] | select(.value.result == "failure") | .key] | join(",")' <<<"$NEEDS_JSON")
            details="One or more build, signing, packaging, release, or feed jobs failed: $stage"
          fi
          scripts/manage-labs-issue.sh failure "$LABS_TAG" "$stage" "$details"

  publish-feed:
    if: ${{ github.event_name == 'release' && startsWith(github.event.release.tag_name, 'labs-v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: labs
          fetch-depth: 0

      - name: Publish feed for manually published draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/publish-labs-feed.sh "${{ github.event.release.tag_name }}"
