# ng-runner-policy: private-jit-only-v1
# Temporary owner-requested consolidation job. Restore manual CI after completion.
name: CI - Sanity Checks
run-name: One-time merged branch cleanup
on:
  push:
    branches: [main]
    paths: [docs/maintainers/branch-consolidation-2026-10-27.json]
permissions: {}
concurrency:
  group: plezyng-branch-consolidation
  cancel-in-progress: false
jobs:
  analyze:
    name: Code Analysis
    if: ${{ github.repository == 'snapetech-org/PlezyNG' && github.ref == 'refs/heads/main' }}
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-plezyng","ng-main-run-{0}","gha-{0}-analyze"]}}', github.run_id)) }}
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Remove only preserved unchanged branch heads
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INTEGRATION_SHA: 0a56d1c9843e7bda8bac036a0190cc14a0ca9d04
          MANIFEST_SHA256: 9658dcb692d7387ad70d504eae6c95a76bb5ccbc46fce8b764f509993c3f510c
        run: |
          set -euo pipefail
          python3 - <<'PY'
          """One-time, atomic deletion of reviewed branches whose history is preserved."""
          import base64
          import hashlib
          import json
          import os
          import re
          import subprocess
          import tempfile
          from pathlib import Path
          
          REPOSITORY = 'snapetech-org/PlezyNG'
          PROTECTED = {'main', 'master'}
          MANIFEST = 'docs/maintainers/branch-consolidation-2026-10-27.json'
          SHA = re.compile(r'^[0-9a-f]{40}$')
          
          
          def deletion_plan(manifest, heads, run_sha, anchor, ancestor):
              if manifest.get('repository') != REPOSITORY:
                  raise ValueError('Unexpected repository')
              if manifest.get('integration_commit') != anchor or not SHA.fullmatch(anchor):
                  raise ValueError('Unexpected integration anchor')
              if heads.get('main') != run_sha:
                  raise ValueError('Main moved; review the newer head before retrying')
              entries = manifest.get('branches', [])
              indexed = {}
              for entry in entries:
                  name, sha = entry['name'], entry['sha']
                  if name in indexed or not SHA.fullmatch(sha):
                      raise ValueError('Invalid or duplicate manifest entry')
                  if name in PROTECTED:
                      if entry['action'] != 'keep':
                          raise ValueError('Protected branch cannot be deleted')
                  elif entry['action'] != 'delete-after-integration':
                      raise ValueError('Branch has no explicit deletion authorization')
                  indexed[name] = entry
              if set(heads) - set(indexed) - PROTECTED:
                  raise ValueError('New branches appeared; review them before cleanup')
              plan = []
              for name, entry in indexed.items():
                  if name in PROTECTED or name not in heads:
                      continue
                  if heads[name] != entry['sha']:
                      raise ValueError(f'Branch moved: {name}')
                  if not ancestor(entry['sha'], anchor):
                      raise ValueError(f'Head is not preserved in integration history: {name}')
                  plan.append((name, entry['sha']))
              return plan
          
          
          def push_arguments(plan):
              return (['push', '--atomic']
                      + [f'--force-with-lease=refs/heads/{name}:{sha}' for name, sha in plan]
                      + ['origin'] + [f':refs/heads/{name}' for name, _ in plan])
          
          
          def main():
              token = os.environ['GH_TOKEN']
              run_sha = os.environ['GITHUB_SHA']
              anchor = os.environ['INTEGRATION_SHA']
              if os.environ.get('GITHUB_REPOSITORY') != REPOSITORY or os.environ.get('GITHUB_REF') != 'refs/heads/main':
                  raise ValueError('Cleanup is restricted to this repository main branch')
              if not SHA.fullmatch(run_sha) or not SHA.fullmatch(anchor):
                  raise ValueError('Invalid commit')
              env = dict(os.environ)
              env.update({
                  'GIT_TERMINAL_PROMPT': '0', 'GIT_CONFIG_NOSYSTEM': '1',
                  'GIT_CONFIG_GLOBAL': os.devnull, 'GIT_CONFIG_COUNT': '1',
                  'GIT_CONFIG_KEY_0': 'http.https://github.com/.extraheader',
                  'GIT_CONFIG_VALUE_0': 'AUTHORIZATION: basic ' + base64.b64encode(('x-access-token:' + token).encode()).decode(),
                  'GIT_TRACE': '0', 'GIT_CURL_VERBOSE': '0', 'GIT_TRACE_CURL': '0',
              })
              with tempfile.TemporaryDirectory(prefix='plezyng-branch-cleanup-') as directory:
                  def git(*args, check=True):
                      return subprocess.run(['git', *args], cwd=directory, env=env, check=check, capture_output=True, text=True)
                  git('init', '--quiet')
                  git('remote', 'add', 'origin', f'https://github.com/{REPOSITORY}.git')
                  # Fetch only commit/tree history and the one manifest blob, not app assets.
                  git('fetch', '--quiet', '--filter=blob:none', '--no-tags', 'origin', run_sha)
                  raw = git('show', f'{run_sha}:{MANIFEST}').stdout
                  if hashlib.sha256(raw.encode()).hexdigest() != os.environ['MANIFEST_SHA256']:
                      raise ValueError('Manifest changed after review')
                  manifest = json.loads(raw)
                  def remote_heads():
                      return {ref.removeprefix('refs/heads/'): sha for sha, ref in
                              (row.split('\t', 1) for row in git('ls-remote', '--heads', 'origin').stdout.splitlines())}
                  def ancestor(sha, target):
                      return git('merge-base', '--is-ancestor', sha, target, check=False).returncode == 0
                  if not ancestor(anchor, run_sha):
                      raise ValueError('Cleanup commit does not preserve integration commit')
                  plan = deletion_plan(manifest, remote_heads(), run_sha, anchor, ancestor)
                  for name, _ in plan:
                      git('check-ref-format', 'refs/heads/' + name)
                  print(f'Verified {len(plan)} unchanged branch heads preserved by {anchor}.', flush=True)
                  if plan:
                      # Client/server ref leases prevent deleting any concurrently updated
                      # branch. Atomic push deletes all verified refs together or none.
                      result = git(*push_arguments(plan))
                      print(result.stdout, end='')
                      print(result.stderr, end='')
                  remaining = remote_heads()
                  if set(remaining) - PROTECTED:
                      raise ValueError('Additional branches remain; review before retrying')
                  print('Remaining branches: ' + ', '.join(sorted(remaining)), flush=True)
                  summary = os.environ.get('GITHUB_STEP_SUMMARY')
                  if summary:
                      with open(summary, 'a') as handle:
                          handle.write(f'Removed {len(plan)} branch names with exact-SHA leases. All recorded commits remain reachable from main.\n')
                          handle.write('Remaining branches: ' + ', '.join(sorted(remaining)) + '\n')
          
          
          if __name__ == '__main__':
              main()
          PY
