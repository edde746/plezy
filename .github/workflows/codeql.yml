# ng-runner-policy: private-jit-only-v1
name: PlezyNG isolated fork CodeQL scan

on:
  workflow_call:

permissions:
  contents: read

jobs:
  analyze:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo != null &&
      github.event.pull_request.head.repo.fork == true &&
      github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name &&
      github.event.pull_request.base.repo.full_name == 'snapetech-org/PlezyNG' &&
      github.event.pull_request.base.ref == 'main'
    name: Analyze isolated fork (${{ matrix.language }})
    runs-on: >-
      ${{ matrix.language == 'swift' && fromJSON('{"group":"public-fork-jit","labels":["self-hosted","macOS","ARM64","public-pr-plezyng"]}') || fromJSON('{"group":"public-fork-jit","labels":["self-hosted","linux","x64","public-pr-plezyng"]}') }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: c-cpp
            build-mode: none
          - language: go
            build-mode: autobuild
          - language: java-kotlin
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: ruby
            build-mode: none
          - language: swift
            build-mode: autobuild
    timeout-minutes: 90
    steps:
      - name: Check out the fork without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Go for CodeQL
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache: false

      - name: Set up Java for CodeQL
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js for CodeQL
        if: matrix.language == 'javascript-typescript'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22.23.4"
          package-manager-cache: false

      - name: Install CocoaPods dependencies for Swift analysis
        if: matrix.language == 'swift'
        run: |
          for project in ios macos tvos; do
            if [ -f "$project/Podfile" ]; then
              (cd "$project" && pod install --deployment)
            fi
          done

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Analyze without uploading from the isolated sandbox
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          output: ${{ runner.temp }}/codeql-results
          upload: never
