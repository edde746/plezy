name: One-off Games localization codegen

on:
  push:
    branches:
      - codex/games-embedded-grid-20261026
    paths:
      - .github/workflows/games-localization-codegen-once.yml

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true
          pub-cache: false
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile --no-example
      - name: Generate checked-in sources
        run: scripts/codegen.sh
      - name: Upload locale outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: games-localization-codegen
          path: lib/i18n/strings_*.g.dart
          if-no-files-found: error
          retention-days: 1

  commit:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: games-localization-codegen
          path: ${{ runner.temp }}/generated-locales
      - name: Commit generated locale outputs
        env:
          GENERATED_LOCALES: ${{ runner.temp }}/generated-locales
        run: |
          cp "$GENERATED_LOCALES"/strings_*.g.dart lib/i18n/
          git add lib/i18n/strings_*.g.dart
          if git diff --cached --quiet; then
            echo "No generated localization changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate localized Dart sources"
          git push origin "HEAD:$GITHUB_REF_NAME"
