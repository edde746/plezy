name: Build tvOS

on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.47.1"
  TRUSTED_BUILD_CACHE_VERSION: trusted-build-v1
  TVOS_ENGINE_URL: "https://github.com/fluttertv/engine-artifacts/releases/download/engine-b118f6897f8f3427d1390c80bbefa90ee948c97e/tvos_release_arm64.zip"

jobs:
  build-tvos:
    runs-on: macos-26
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: "${{ env.TRUSTED_BUILD_CACHE_VERSION }}-flutter-:os:-:channel:-:version:-:arch:-:hash:"
          pub-cache: false

      - name: Cache Pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pub-cache
          key: ${{ env.TRUSTED_BUILD_CACHE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-pub-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}

      - name: Cache CocoaPods
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            tvos/Pods
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: ${{ env.TRUSTED_BUILD_CACHE_VERSION }}-${{ runner.os }}-tvos-pods-${{ hashFiles('tvos/Podfile.lock') }}

      - name: Cache tvOS engine
        id: tvos-engine-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: tvos-engine
          key: ${{ env.TRUSTED_BUILD_CACHE_VERSION }}-tvos-engine-b118f6897f8f3427d1390c80bbefa90ee948c97e

      - name: Download tvOS Flutter engine
        if: steps.tvos-engine-cache.outputs.cache-hit != 'true'
        run: |
          curl -L ${{ env.TVOS_ENGINE_URL }} -o tvos-engine.zip
          unzip tvos-engine.zip -d engine-extract
          mkdir -p tvos-engine/out/tvos_release
          cp -r engine-extract/tvos_release_arm64/* tvos-engine/out/tvos_release/
          mkdir -p tvos-engine/out/tvos_debug_sim_unopt_arm64
          mkdir -p tvos-engine/out/tvos_debug_unopt

      - name: Setup gen_snapshot
        run: |
          flutter precache --ios
          mkdir -p tvos-engine/out/host_release
          GEN_SNAPSHOT=$(find $FLUTTER_ROOT -name "gen_snapshot" | head -1)
          echo "Found gen_snapshot at: $GEN_SNAPSHOT"
          cp "$GEN_SNAPSHOT" tvos-engine/out/host_release/gen_snapshot
          chmod +x tvos-engine/out/host_release/gen_snapshot

      - name: Install Flutter dependencies
        run: flutter pub get --enforce-lockfile --no-example

      - name: Generate Generated.xcconfig for tvOS
        run: |
          cat > tvos/Flutter/Generated.xcconfig << EOF
          FLUTTER_ROOT=$FLUTTER_ROOT
          FLUTTER_APPLICATION_PATH=$PWD
          COCOAPODS_PARALLEL_CODE_SIGN=true
          FLUTTER_TARGET=lib/main.dart
          FLUTTER_BUILD_DIR=build
          FLUTTER_BUILD_NAME=1.0.0
          FLUTTER_BUILD_NUMBER=1
          DART_OBFUSCATION=false
          TRACK_WIDGET_CREATION=false
          TREE_SHAKE_ICONS=false
          PACKAGE_CONFIG=$PWD/.dart_tool/package_config.json
          FLUTTER_LOCAL_ENGINE=$PWD/tvos-engine
          EOF

      - name: Install CocoaPods dependencies
        run: |
          cd tvos
          pod install

      - name: Build tvOS (no codesign)
        run: |
          cd tvos
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -sdk appletvos \
            -destination generic/platform=tvOS \
            -archivePath $PWD/build/Runner.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO

      - name: Create IPA
        run: |
          cd tvos
          mkdir -p Payload
          cp -r build/Runner.xcarchive/Products/Applications/Runner.app Payload/
          zip -r plezy-tvos.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tvos-ipa
          path: tvos/plezy-tvos.ipa
