name: Games embedded engine

on:
  pull_request:
    paths:
      - '.github/workflows/games-native.yml'
      - 'android/**'
      - 'native/games/**'
      - 'scripts/games/**'
      - 'games-native.lock.json'
      - 'lib/games/**'
      - 'lib/multiview/**'
      - 'lib/screens/games/**'
      - 'lib/screens/sources/**'
      - 'lib/screens/video_player/**'
      - 'lib/screens/video_player_screen.dart'
      - 'lib/mpv/player/**'
      - 'lib/services/playback_coordinator.dart'
      - 'lib/services/video_volume_controller.dart'
      - 'lib/services/music/**'
      - 'lib/sources/source_playback.dart'
      - 'test/games/**'
      - 'test/multiview/**'
      - 'test/services/gamepad_service_test.dart'
      - 'test/services/playback_coordinator_test.dart'
      - 'test/services/video_volume_controller_test.dart'
      - 'test/services/music/music_playback_service_test.dart'
      - 'test/sources/source_playback_test.dart'
      - 'ios/Runner/AppDelegate.swift'
      - 'ios/Runner/MpvPlayer/**'
      - 'macos/Runner/MainFlutterWindow.swift'
      - 'macos/Runner/MpvPlayer/**'
      - 'linux/runner/my_application.cc'
      - 'linux/runner/mpv/**'
      - 'windows/runner/flutter_window.cpp'
      - 'windows/runner/mpv/**'
      - 'docs/games/**'
      - 'docs/plezyng/multiview/**'
      - 'pubspec.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  steam-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Prepare pinned native sources
        run: python3 scripts/games/prepare_steam.py
      - name: Install Vulkan loader, headers and software driver
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers
      - name: Configure transport and lifecycle tests with sanitizers
        run: >-
          cmake -S native/games/steam -B build/games-steam-tests
          -DPLEZY_STEAM_TESTS=ON -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer'
          -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer'
          -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
      - name: Build native tests
        run: cmake --build build/games-steam-tests --parallel 2
      - name: Run transport and adapter tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build/games-steam-tests --output-on-failure

  android-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true
          pub-cache: false
      - name: Check private manifest and cancellation patches
        run: python3 -m unittest discover -s scripts/games -p 'test_*.py'
      - name: Resolve application dependencies
        run: flutter pub get --enforce-lockfile --no-example
      - name: Configure Android tools
        run: printf 'flutter.sdk=%s\nsdk.dir=%s\n' "$FLUTTER_ROOT" "$ANDROID_HOME" > android/local.properties
      - name: Compile both pinned embedded engines, JNI and adapters
        working-directory: android
        run: ./gradlew :moonlight:assembleDebug :steam:assembleDebug :steam:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Run focused game and Multiview regression tests
        run: >-
          flutter test test/games test/multiview
          test/services/gamepad_service_test.dart
          test/services/playback_coordinator_test.dart
          test/services/video_volume_controller_test.dart
          test/services/music/music_playback_service_test.dart
          test/sources/source_playback_test.dart
