name: Games embedded engine

on:
  pull_request:
    paths:
      - '.github/workflows/games-native.yml'
      - 'android/**'
      - 'scripts/games/**'
      - 'games-native.lock.json'
      - 'pubspec.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true
          pub-cache: false
      - name: Check private manifest and cancellation patches
        run: python3 -m unittest discover -s scripts/games -p 'test_*.py'
      - name: Resolve application dependencies
        run: flutter pub get --enforce-lockfile --no-example
      - name: Configure Android tools
        run: printf 'flutter.sdk=%s\nsdk.dir=%s\n' "$FLUTTER_ROOT" "$ANDROID_HOME" > android/local.properties
      - name: Compile the pinned embedded engine, JNI and adapter
        working-directory: android
        run: ./gradlew :moonlight:assembleDebug --stacktrace
