# ng-runner-policy: private-jit-only-v1
name: Dolby Vision platform experiments

# Runs only when selected from Actions.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dv-platforms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os == 'ubuntu-24.04' && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-plezyng","ng-main-run-{0}","gha-{0}-{1}-contracts"]}}', github.run_id, strategy.job-index)) || matrix.os == 'windows-2025' && fromJSON(format('{{"group":"packer-windows","labels":["self-hosted","Windows","X64","packer-windows","ng-shared-main-plezyng","ng-main-run-{0}","gha-{0}-{1}-contracts"]}}', github.run_id, strategy.job-index)) || fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","macOS","ARM64","ng-shared-main-plezyng","ng-main-run-{0}","gha-{0}-{1}-contracts"]}}', github.run_id, strategy.job-index)) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: python3 scripts/test_dv_experiments.py

  app-tests:
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-plezyng","ng-main-run-{0}","gha-{0}-app-tests"]}}', github.run_id)) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true
          pub-cache: false
      - run: flutter pub get
      - name: Generate translations and format changed Dart files
        run: |
          dart run slang
          dart format lib/media/dolby_vision_playback.dart lib/mpv/player/player_native.dart lib/services/settings_service.dart lib/screens/settings/playback_settings_screen.dart lib/screens/video_player_screen.dart lib/widgets/video_controls/widgets/performance_overlay/performance_stats.dart lib/widgets/video_controls/widgets/performance_overlay/performance_stats_service.dart test/media/dolby_vision_playback_test.dart test/mpv/player_native_bridge_test.dart test/screens/settings/playback_settings_screen_test.dart
      - name: Test app settings, initialization and playback diagnostics
        run: flutter test test/media/dolby_vision_playback_test.dart test/mpv/player_native_bridge_test.dart test/screens/settings/playback_settings_screen_test.dart test/widgets/performance_stats_service_test.dart
      - name: Native renderer selection tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror linux/runner/mpv/experimental_render_api_test.cc -o /tmp/dv-render-api
          /tmp/dv-render-api
      - name: Export generation changes for review
        if: always()
        run: python3 tools/dv-engine/ci_snapshot.py
      - name: Require committed generated output
        run: git diff --exit-code -- lib test

  felbaker-source:
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-plezyng","ng-main-run-{0}","gha-{0}-felbaker-source"]}}', github.run_id)) }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Prepare recorded build tools
        run: |
          python3 -m pip install 'meson==1.10.0' 'ninja==1.13.0'
          rustup toolchain install 1.97.0 --profile minimal
          cargo +1.97.0 install cargo-c --version '0.10.26' --locked
      - name: Build pinned FEL companion plugin
        env:
          RUSTUP_TOOLCHAIN: 1.97.0
        run: python3 tools/dv-engine/build_adapters.py --component felbaker --work-dir build/dv-felbaker --build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: dv-felbaker-source-build
          path: |
            build/dv-felbaker/adapter-report.json
            build/dv-felbaker/build/meson-logs/
            build/dv-felbaker/build/*felbaker*.so
            build/dv-felbaker/sources/felbaker/
          retention-days: 14

  apple-source:
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","macOS","ARM64","ng-shared-main-plezyng","ng-main-run-{0}","gha-{0}-apple-source"]}}', github.run_id)) }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build isolated Apple host and test dual-layer code
        run: |
          set -o pipefail
          command -v xcodegen
          mkdir -p build
          python3 tools/dv-engine/build_adapters.py --component apple --apple-platform all --work-dir build/dv-apple --build --test 2>&1 | tee build/dv-apple.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: dv-apple-source-diagnostics
          path: |
            build/dv-apple.log
            build/dv-apple/adapter-report.json
            build/dv-apple/host/Package.resolved
          retention-days: 14

  windows-engine:
    runs-on: ${{ fromJSON(format('{{"group":"packer-windows","labels":["self-hosted","Windows","X64","packer-windows","ng-shared-main-plezyng","ng-main-run-{0}","gha-{0}-windows-engine"]}}', github.run_id)) }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: true
          path-type: minimal
          install: >-
            git make nasm
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-shaderc
            mingw-w64-ucrt-x86_64-spirv-cross
            mingw-w64-ucrt-x86_64-libass
            mingw-w64-ucrt-x86_64-lcms2
            mingw-w64-ucrt-x86_64-libjpeg-turbo
      - name: Build the pinned D3D11 engine and run upstream checks
        shell: msys2 {0}
        run: |
          set -o pipefail
          mkdir -p build
          python tools/dv-engine/build_windows.py --work-dir build/dv-windows --jobs 4 2>&1 | tee build/dv-windows.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: dv-windows-x86_64-development
          path: |
            build/dv-windows.log
            build/dv-windows/*.zip
            build/dv-windows/*.sha256
            build/dv-windows/bundle/*.json
            build/dv-windows/*-build/meson-logs/
          retention-days: 14

  native-patch-audit:
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-plezyng","ng-main-run-{0}","gha-{0}-native-patch-audit"]}}', github.run_id)) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Audit every production native patch stack against the FEL sources
        run: python3 tools/dv-engine/audit_native_ports.py --platform all --work-dir build/dv-native-audit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: dv-native-port-audit
          path: build/dv-native-audit/native-port-audit.json
          retention-days: 14

