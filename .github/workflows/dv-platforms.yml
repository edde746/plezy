name: Dolby Vision platform experiments

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/dv-engine/**'
      - 'tools/dv-apple/**'
      - 'lib/**'
      - 'test/**'
      - 'linux/runner/mpv/**'
      - '.github/workflows/dv-platforms.yml'

permissions:
  contents: read

concurrency:
  group: dv-platforms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-contracts:
    if: ${{ github.repository == 'snapetech-org/PlezyNG' && github.ref == 'refs/heads/main' }}
    runs-on:
      group: ng-shared-main-jit
      labels:
        - self-hosted
        - linux
        - x64
        - ng-shared-main-plezyng
        - ${{ format('ng-main-run-{0}', github.run_id) }}
        - ${{ format('gha-{0}-linux-contracts', github.run_id) }}
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: python scripts/test_dv_experiments.py

  windows-contracts:
    if: ${{ github.repository == 'snapetech-org/PlezyNG' && github.ref == 'refs/heads/main' }}
    runs-on:
      group: packer-windows
      labels: [self-hosted, Windows, X64, on-demand, packer-windows, PlezyNG]
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: python scripts/test_dv_experiments.py

  apple-contracts:
    if: ${{ github.repository == 'snapetech-org/PlezyNG' && github.ref == 'refs/heads/main' }}
    runs-on:
      group: private-apple-builds
      labels: [self-hosted, macOS, ARM64, private-apple-jit, PlezyNG]
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: python scripts/test_dv_experiments.py

  app-tests:
    if: ${{ github.repository == 'snapetech-org/PlezyNG' && github.ref == 'refs/heads/main' }}
    runs-on:
      group: ng-shared-main-jit
      labels:
        - self-hosted
        - linux
        - x64
        - ng-shared-main-plezyng
        - ${{ format('ng-main-run-{0}', github.run_id) }}
        - ${{ format('gha-{0}-app-tests', github.run_id) }}
    timeout-minutes: 30
    steps:
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true
          pub-cache: false
      - run: flutter pub get
      - name: Generate translations and format changed Dart files
        run: |
          dart run slang
          dart format lib/media/dolby_vision_playback.dart lib/mpv/player/player_native.dart lib/services/settings_service.dart lib/screens/settings/playback_settings_screen.dart lib/screens/video_player_screen.dart lib/widgets/video_controls/widgets/performance_overlay/performance_stats.dart lib/widgets/video_controls/widgets/performance_overlay/performance_stats_service.dart test/media/dolby_vision_playback_test.dart test/mpv/player_native_bridge_test.dart test/screens/settings/playback_settings_screen_test.dart
      - name: Test app settings, initialization and playback diagnostics
        run: flutter test test/media/dolby_vision_playback_test.dart test/mpv/player_native_bridge_test.dart test/screens/settings/playback_settings_screen_test.dart test/widgets/performance_stats_service_test.dart
      - name: Test Android Dolby routing and conversion
        working-directory: android
        run: ./gradlew app:testDebugUnitTest --tests com.edde746.plezy.mpv.GpuVoPolicyTest --tests com.edde746.plezy.mpv.DecoderOptionsTest --tests com.edde746.plezy.mpv.DoviConvertingTrackOutputTest
      - name: Native renderer selection tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror linux/runner/mpv/experimental_render_api_test.cc -o /tmp/dv-render-api
          /tmp/dv-render-api
      - name: Export generation changes for review
        if: always()
        run: python3 tools/dv-engine/ci_snapshot.py
      - name: Require committed generated output
        run: git diff --exit-code -- lib test

  felbaker-source:
    if: ${{ github.repository == 'snapetech-org/PlezyNG' && github.ref == 'refs/heads/main' }}
    runs-on:
      group: ng-shared-main-jit
      labels:
        - self-hosted
        - linux
        - x64
        - ng-shared-main-plezyng
        - ${{ format('ng-main-run-{0}', github.run_id) }}
        - ${{ format('gha-{0}-felbaker-source', github.run_id) }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Prepare recorded build tools
        run: |
          python3 -m pip install 'meson==1.10.0' 'ninja==1.13.0'
          rustup toolchain install 1.97.0 --profile minimal
          cargo +1.97.0 install cargo-c --version '0.10.26' --locked
      - name: Build pinned FEL companion plugin
        env:
          RUSTUP_TOOLCHAIN: 1.97.0
        run: python3 tools/dv-engine/build_adapters.py --component felbaker --work-dir build/dv-felbaker --build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: dv-felbaker-source-build
          path: |
            build/dv-felbaker/adapter-report.json
            build/dv-felbaker/build/meson-logs/
            build/dv-felbaker/build/*felbaker*.so
            build/dv-felbaker/sources/felbaker/
          retention-days: 14

  apple-source:
    if: ${{ github.repository == 'snapetech-org/PlezyNG' && github.ref == 'refs/heads/main' }}
    runs-on:
      group: private-apple-builds
      labels: [self-hosted, macOS, ARM64, private-apple-jit, PlezyNG]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build isolated Apple host and test dual-layer code
        run: |
          set -o pipefail
          mkdir -p build
          python3 tools/dv-engine/build_adapters.py --component apple --work-dir build/dv-apple --build --test 2>&1 | tee build/dv-apple.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: dv-apple-source-diagnostics
          path: |
            build/dv-apple.log
            build/dv-apple/adapter-report.json
            build/dv-apple/host/Package.resolved
          retention-days: 14
