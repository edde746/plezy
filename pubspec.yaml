name: plezy
description: "Plezy GKUI compatibility fork"
publish_to: "none"
version: 1.2.2+8

environment:
  sdk: ">=3.3.4 <3.4.0"

dependencies:
  flutter:
    sdk: flutter
  cached_network_image: 3.4.0
  dio: 5.9.0
  qr_flutter: 4.1.0
  shared_preferences: 2.2.3
  uuid: 4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/plezy.png
    - assets/ca/legacy-roots.pem
  fonts:
    - family: PlezySans
      fonts:
        - asset: assets/droid-sans.ttf
