services:
  relay:
    build: .
    restart: unless-stopped
    mem_limit: 128m
    stop_grace_period: 15s
    volumes:
      - logs:/data
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      OAUTH_BASE_URL: ${PLEZY_SERVER_PUBLIC_URL:?Set PLEZY_SERVER_PUBLIC_URL to this relay's public HTTPS URL}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:?Set TRUSTED_PROXY_CIDRS to the reverse proxy network CIDR}
      MAL_CLIENT_ID: ${MAL_CLIENT_ID:-}
      ANILIST_CLIENT_ID: ${ANILIST_CLIENT_ID:-}
      ANILIST_CLIENT_SECRET: ${ANILIST_CLIENT_SECRET:-}
      STEAM_WEB_API_KEY: ${STEAM_WEB_API_KEY:-}
      COMIC_COMMERCE_ALLOWED_ORIGINS: ${COMIC_COMMERCE_ALLOWED_ORIGINS:-}
      DRIVETHRU_COMICS_AFFILIATE_ID: ${DRIVETHRU_COMICS_AFFILIATE_ID:-}
      DRIVETHRU_COMICS_AFFILIATE_APPROVED: ${DRIVETHRU_COMICS_AFFILIATE_APPROVED:-false}
      FANATICAL_AWIN_APPROVED: ${FANATICAL_AWIN_APPROVED:-false}
      FANATICAL_AWIN_ADVERTISER_ID: ${FANATICAL_AWIN_ADVERTISER_ID:-}
      AWIN_PUBLISHER_ID: ${AWIN_PUBLISHER_ID:-}
      AWIN_API_TOKEN: ${AWIN_API_TOKEN:-}
      RENTA_FLEXOFFERS_APPROVED: ${RENTA_FLEXOFFERS_APPROVED:-false}
      RENTA_FLEXOFFERS_ADVERTISER_ID: ${RENTA_FLEXOFFERS_ADVERTISER_ID:-}
      HUMBLE_FLEXOFFERS_APPROVED: ${HUMBLE_FLEXOFFERS_APPROVED:-false}
      HUMBLE_FLEXOFFERS_ADVERTISER_ID: ${HUMBLE_FLEXOFFERS_ADVERTISER_ID:-}
      FLEXOFFERS_API_KEY: ${FLEXOFFERS_API_KEY:-}
      FLEXOFFERS_API_KEY_HEADER: ${FLEXOFFERS_API_KEY_HEADER:-Authorization}
      FLEXOFFERS_API_KEY_PREFIX: ${FLEXOFFERS_API_KEY_PREFIX:-}
      EBOOKS_COM_AFFILIATE_APPROVED: ${EBOOKS_COM_AFFILIATE_APPROVED:-false}
      EBOOKS_COM_AFFILIATE_ID: ${EBOOKS_COM_AFFILIATE_ID:-}
      BOOKSHOP_AFFILIATE_APPROVED: ${BOOKSHOP_AFFILIATE_APPROVED:-false}
      BOOKSHOP_AFFILIATE_ID: ${BOOKSHOP_AFFILIATE_ID:-}
      KOBO_RAKUTEN_APPROVED: ${KOBO_RAKUTEN_APPROVED:-false}
      KOBO_RAKUTEN_ADVERTISER_ID: ${KOBO_RAKUTEN_ADVERTISER_ID:-}
      KOBO_RAKUTEN_API_TOKEN: ${KOBO_RAKUTEN_API_TOKEN:-}
      GUMROAD_AFFILIATE_APPROVED: ${GUMROAD_AFFILIATE_APPROVED:-false}
      GUMROAD_DISCOVER_AFFILIATE_URL: ${GUMROAD_DISCOVER_AFFILIATE_URL:-}
      GUMROAD_CREATOR_LINKS_JSON: ${GUMROAD_CREATOR_LINKS_JSON:-}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  logs:
