appId: com.edde746.plezy
name: Browse library and open media details
tags:
  - e2e
  - library
---
- runFlow: ../subflows/ensure_onboarded.yaml
- tapOn: "(?s)^Libraries.*"
- tapOn: "Browse"
- extendedWaitUntil:
    visible: "(?s).*Maestro Movies.*"
    timeout: 15000
- extendedWaitUntil:
    visible: "(?s).*Alpha Archive.*"
    timeout: 15000
- tapOn: "(?s).*Alpha Archive.*"
- extendedWaitUntil:
    visible: "Overview"
    timeout: 15000
- assertVisible: "A deterministic title for TV alphabet focus coverage."
- assertVisible: "Play"
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          point: "6%, 9%"
- runFlow:
    when:
      platform: Android
    commands:
      - back
- assertVisible: "(?s).*Maestro Movies.*"
