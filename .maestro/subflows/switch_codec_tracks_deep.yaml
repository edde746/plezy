appId: com.edde746.plezy.dev
---
- assertVisible: "${AUDIO_TRACK}"
- tapOn:
    text: "${AUDIO_TRACK}"
- extendedWaitUntil:
    visible: "(?s)^.*Audio & Subtitles$"
    timeout: 30000
- tapOn: "(?s)^.*Audio & Subtitles$"
- repeat:
    times: 12
    while:
      notVisible: "${SUBTITLE_TRACK}"
    commands:
      - swipe:
          start: 70%, 82%
          end: 70%, 68%
          duration: 300
- assertVisible: "${SUBTITLE_TRACK}"
- tapOn:
    text: "${SUBTITLE_TRACK}"
- extendedWaitUntil:
    visible: "(?s)^.*Audio & Subtitles$"
    timeout: 30000
- tapOn: "(?s)^.*Audio & Subtitles$"
- assertVisible:
    text: "${AUDIO_TRACK}"
    selected: true
- repeat:
    times: 12
    while:
      notVisible: "${SUBTITLE_TRACK}"
    commands:
      - swipe:
          start: 70%, 82%
          end: 70%, 68%
          duration: 300
- assertVisible:
    text: "${SUBTITLE_TRACK}"
    selected: true
- back
