appId: com.edde746.plezy
---
# Onboard a device that reports itself as a TV; unlike the phone flow, it starts
# in TV layout and needs no Force TV mode walk.
- retry:
    maxRetries: 1
    commands:
      - launchApp:
          clearState: true
          permissions:
            all: allow
      - extendedWaitUntil:
          visible: "(?s)^(?:Connect to Jellyfin|Wait).*"
          timeout: 30000
      - runFlow:
          when:
            visible: "Wait"
          commands:
            - tapOn: "Wait"
      - extendedWaitUntil:
          visible: "Connect to Jellyfin"
          timeout: 30000
- tapOn: "Connect to Jellyfin"
- extendedWaitUntil:
    visible: "Add Jellyfin server"
    timeout: 15000
- tapOn: "(?s)Server URLs.*"
- inputText: ${JELLYFIN_URL}
- tapOn: "Find server"
# Quick Connect is awkward on a remote and needs another device, so use the
# username form as fallback.
- extendedWaitUntil:
    visible: "(?s)^(?:Username|Cancel)$"
    timeout: 30000
- runFlow:
    when:
      notVisible: "Username"
    commands:
      - tapOn: "Cancel"
- extendedWaitUntil:
    visible: "Username"
    timeout: 20000
- tapOn: "Username"
- inputText: "maestro"
- tapOn: "Password"
- inputText: "maestro"
- tapOn: "Sign in"
- extendedWaitUntil:
    visible:
      id: "tv_browse_rail_selection"
    timeout: 45000
