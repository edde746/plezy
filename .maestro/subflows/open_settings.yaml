appId: com.edde746.plezy.dev
---
# Reach phone Settings from signed-in Home. The profile menu is an overlay
# sheet; retry while the previous route settles.
- extendedWaitUntil:
    visible: "Discover"
    timeout: 30000
- repeat:
    times: 3
    while:
      notVisible: "Settings"
    commands:
      - tapOn: "(?s)^M(?:.*Profiles.*)?$"
      - waitForAnimationToEnd:
          timeout: 3000
- tapOn:
    text: "Settings"
    below:
      text: "Profiles"
- extendedWaitUntil:
    visible: "(?s)^Appearance.*"
    timeout: 15000
- assertVisible: "(?s)^Manage Libraries.*"
